<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body style="margin:0">
<title>Don Quixote of La Mancha</title>
<style>
/* Layout: una sola pantalla de Spectrum centrada, con su borde de color y un pie mínimo.
   Mundo único y oscuro a propósito (como un televisor de 1989): sin tema claro. */
:root {
  --bg: #15131a;          /* fondo de salón con la luz apagada */
  --fg: #cfcad6;          /* texto del pie */
  --muted: #8b8496;       /* ayudas */
  --key: #2a2631;         /* teclas de ejemplo */
  --keyfg: #e8e4ee;
  --focus: #d7d700;       /* amarillo Spectrum */
  --ui: "Spline Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.wrap { box-sizing: border-box; min-height: 100%; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 14px; padding-block: 16px; padding-inline: 16px; }
.tv { position: relative; width: min(100%, 832px); }
#border { background: #000; padding: 6.25% 7.8%; transition: background-color .15s linear; border-radius: 3px; }
#screen { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; image-rendering: pixelated; image-rendering: crisp-edges; }
/* el campo real de escritura va invisible encima de la pantalla: así aparece el teclado en el móvil */
#cmd { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; padding: 0; margin: 0;
  font-size: 16px; color: transparent; background: transparent; caret-color: transparent; cursor: text; }
.tv:focus-within #border { outline: 2px solid var(--focus); outline-offset: 3px; }
.foot { width: min(100%, 832px); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 18px;
  font-size: 12px; line-height: 1.6; color: var(--muted); }
.foot p { margin: 0; min-width: 0; }
kbd { font-family: var(--ui); font-size: 11px; background: var(--key); color: var(--keyfg); padding: 1px 5px; border-radius: 3px; letter-spacing: .04em; }
@media (prefers-reduced-motion: reduce) { #border { transition: none; } }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spline+Sans+Mono:wght@400;500&display=swap">
<div class="wrap">
  <div class="tv">
    <div id="border"><canvas id="screen" width="256" height="192" aria-label="Adventure screen"></canvas></div>
    <input id="cmd" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" aria-label="Type your command and press Enter">
  </div>
  <div class="foot">
    <p>Type and press <kbd>Enter</kbd>. On a phone, tap the screen. Try <kbd>HELP</kbd>, <kbd>EXITS</kbd>, <kbd>I</kbd>, <kbd>SAVE</kbd>. <a href="../">Español</a></p>
    <p>(c) Aventuras Level 10 · 1989 / 2026</p>
  </div>
</div>
<script>/*
 * Motor de aventuras tipo PAW (Professional Adventure Writer) en JavaScript.
 * Remake 2026 de "Don Quijote de la Mancha" (Aventuras Level 10, 1989).
 *
 * La base de datos (db) la genera tools/pawc.py a partir del fuente src/*.paw.
 * El motor no sabe nada de pantallas: toda la E/S pasa por el objeto `io`,
 * que en el navegador es la pantalla Spectrum (screen.js) y en Node el
 * arnés de pruebas (test/run.mjs).
 *
 * Interfaz io (todas las funciones pueden devolver Promise):
 *   print(text)        texto con códigos de color \x10n (ink) \x11n (paper) \x13n (bright)
 *   cls()              borra toda la pantalla
 *   picture(n)         dibuja la imagen n (o -1 para ninguna) en la zona gráfica
 *   input()            devuelve la orden tecleada (string)
 *   anykey(prompt)     espera una tecla
 *   pause(ms)          pausa
 *   border(n)          color del borde
 *   store(key, value?) persistencia (SAVE/LOAD); devuelve el valor si value es undefined
 */
(function (root) {
  'use strict';

  // Flags del sistema, con los mismos números que PAW
  const F = {
    CARRIED: 1, SCORE: 30, TURNS_LO: 31, TURNS_HI: 32, VERB: 33, NOUN1: 34, ADJ1: 35,
    ADVERB: 36, MAXOBJ: 37, LOC: 38, PREP: 43, NOUN2: 44, ADJ2: 45, OBJREF: 51, MAXWEIGHT: 52,
  };
  // Localidades especiales de objetos
  const L = { NOTCREATED: 252, WORN: 253, CARRIED: 254, HERE: 255 };
  const NONE = 255;
  // Tipos de palabra del vocabulario
  const T = { VERB: 0, ADVERB: 1, NOUN: 2, ADJ: 3, PREP: 4, CONJ: 5, PRON: 6 };

  // Señales de control de flujo (se lanzan como excepciones)
  class Signal { constructor(kind, data) { this.kind = kind; this.data = data; } }

  /** Normaliza texto tecleado: mayúsculas, sin acentos salvo la Ñ */
  function normalize(s) {
    return s.toUpperCase()
      .replace(/[ÁÀÂÄ]/g, 'A').replace(/[ÉÈÊË]/g, 'E').replace(/[ÍÌÎÏ]/g, 'I')
      .replace(/[ÓÒÔÖ]/g, 'O').replace(/[ÚÙÛÜ]/g, 'U');
  }

  class Engine {
    constructor(db, io) {
      this.db = db;
      this.io = io;
      // Índice de vocabulario: palabra(5) -> lista de [num, tipo]
      this.voc = new Map();
      for (const [w, n, t] of db.vocab) {
        if (!this.voc.has(w)) this.voc.set(w, []);
        this.voc.get(w).push([n, t]);
      }
      this.reset();
    }

    reset() {
      this.flags = new Array(256).fill(0);
      this.flags[F.MAXOBJ] = this.db.config.maxobj;
      this.flags[F.MAXWEIGHT] = this.db.config.maxweight;
      this.flags[F.LOC] = this.db.config.start;
      this.objloc = this.db.objs.map(o => o.loc);
      this.ramsave = null;
      this.sentences = [];     // frases pendientes de la última orden
      this.quoted = null;      // texto entre comillas (para PARSE)
      this.lastVerb = NONE;
      this.lastNoun = NONE; this.lastAdj = NONE;
    }

    // ---------------------------------------------------------------- texto
    msg(n) { return this.db.msgs[n]; }
    sys(n) { return this.db.sys[n] || ''; }
    async out(s) { await this.io.print(s); }
    async sysmess(n) {
      let s = this.sys(n);
      if (s.includes('_')) {
        const o = this.flags[F.OBJREF];
        s = s.replace('_', o < this.db.objs.length ? this.db.objs[o].text : '');
      }
      await this.out(s);
    }

    // ---------------------------------------------------------- objetos
    objsAt(loc) {
      const r = [];
      for (let i = 0; i < this.objloc.length; i++) if (this.objloc[i] === loc) r.push(i);
      return r;
    }
    countCarried() { return this.objsAt(L.CARRIED).length; }
    weight(o) {
      let w = this.db.objs[o].w;
      if (this.db.objs[o].cont) for (const c of this.objsAt(o)) w += this.weight(c);
      return w;
    }
    carriedWeight() {
      let w = 0;
      for (let i = 0; i < this.objloc.length; i++)
        if (this.objloc[i] === L.CARRIED || this.objloc[i] === L.WORN) w += this.weight(i);
      return w;
    }
    /** Busca el objeto de noun1/adj1, prefiriendo los de `prefer` (lista de localidades) */
    findObj(noun, adj, prefer) {
      const cands = [];
      for (let i = 0; i < this.db.objs.length; i++) {
        const o = this.db.objs[i];
        if (o.noun === noun && noun !== NONE && (adj === NONE || o.adj === adj)) cands.push(i);
      }
      for (const loc of prefer) for (const c of cands) if (this.objloc[c] === loc) return c;
      return cands.length ? cands[0] : -1;
    }
    here() { return this.flags[F.LOC]; }
    /** Puntuación en tanto por ciento sobre db.config.maxscore (flag 30 = puntos) */
    percent() { return Math.floor(this.flags[F.SCORE] * 100 / (this.db.config.maxscore || 100)); }
    isPresent(o) {
      const l = this.objloc[o];
      return l === L.CARRIED || l === L.WORN || l === this.here();
    }
    async listObjs(objs, intro) {
      if (!objs.length) return false;
      let s = intro;
      objs.forEach((o, i) => {
        s += this.db.objs[o].text;
        if (i < objs.length - 2) s += this.sys(46);
        else if (i === objs.length - 2) s += this.sys(47);
      });
      await this.out(s + this.sys(48));
      return true;
    }

    // ---------------------------------------------------------- parser
    lookup(word) {
      const w = word.slice(0, 5);
      return this.voc.get(w) || null;
    }
    /** Separa la orden en frases y guarda el texto entre comillas */
    splitInput(line) {
      line = normalize(line);
      this.quoted = null;
      const q = line.indexOf('"');
      if (q >= 0) {
        const q2 = line.indexOf('"', q + 1);
        this.quoted = line.slice(q + 1, q2 < 0 ? undefined : q2);
        line = line.slice(0, q) + ' ' + (q2 < 0 ? '' : line.slice(q2 + 1));
      }
      const sentences = [];
      let cur = [];
      for (const tok of line.split(/([.,;:])|\s+/)) {
        if (tok === undefined || tok === '') continue;
        if (/^[.,;:]$/.test(tok)) { if (cur.length) sentences.push(cur); cur = []; continue; }
        const e = this.lookup(tok);
        if (e && e.some(([, t]) => t === T.CONJ)) { if (cur.length) sentences.push(cur); cur = []; continue; }
        cur.push(tok);
      }
      if (cur.length) sentences.push(cur);
      return sentences;
    }
    /** Analiza una frase y rellena los flags 33-36, 43-45. Devuelve false si no hay nada útil. */
    parseSentence(words) {
      let verb = NONE, n1 = NONE, a1 = NONE, n2 = NONE, a2 = NONE, prep = NONE, adv = NONE;
      let pron = false, any = false;
      const ENCL = ['SELO', 'SELA', 'SELOS', 'SELAS', 'LOS', 'LAS', 'LES', 'LO', 'LA', 'LE', 'ME', 'TE', 'SE'];
      for (let word of words) {
        let e = this.lookup(word);
        // enclíticos: COGELA, DAMELO, DESATALO... (solo en español)
        if (!e && (this.db.config.lang || 'es') === 'es') {
          for (const suf of ENCL) {
            if (word.length > suf.length + 2 && word.endsWith(suf)) {
              const base = word.slice(0, -suf.length);
              const be = this.lookup(base);
              if (be && be.some(([, t]) => t === T.VERB)) {
                e = be;
                if (!['ME', 'TE', 'SE'].includes(suf)) pron = true;
                break;
              }
            }
          }
        }
        if (!e) continue;
        any = true;
        const has = t => e.find(([, tt]) => tt === t);
        let v;
        if (verb === NONE && (v = has(T.VERB))) { verb = v[0]; continue; }
        if ((v = has(T.NOUN))) {
          if (n1 === NONE) { n1 = v[0]; continue; }
          // una dirección detrás del objeto no es el segundo nombre (TAKE SWORD OUT OF BAGS)
          if (n2 === NONE && !(v[0] < 20 && verb !== NONE && n1 >= 20)) { n2 = v[0]; continue; }
          continue;
        }
        if ((v = has(T.ADJ))) { if (n2 !== NONE) a2 = v[0]; else a1 = a1 === NONE ? v[0] : a1; continue; }
        if ((v = has(T.PREP))) { if (prep === NONE) prep = v[0]; continue; }
        if ((v = has(T.ADVERB))) { if (adv === NONE) adv = v[0]; continue; }
        if ((v = has(T.PRON))) { pron = true; continue; }
      }
      if (!any) return false;
      // Nombres de movimiento (<20) sin verbo: hacen de verbo (N, SUBIR, SALIR...)
      if (verb === NONE && n1 !== NONE && n1 < 20) { verb = n1; n1 = n2; a1 = a2; n2 = NONE; a2 = NONE; }
      // con verbo, una palabra de dirección delante de un nombre sobra (PICK UP THE LANCE)
      else if (verb !== NONE && n1 !== NONE && n1 < 20 && n2 !== NONE) { n1 = n2; a1 = a2; n2 = NONE; a2 = NONE; }
      if (pron && n1 === NONE) { n1 = this.lastNoun; a1 = this.lastAdj; }
      if (verb === NONE) verb = this.lastVerb;
      if (verb === NONE && n1 === NONE) return false;
      if (n1 !== NONE && n1 >= 20) { this.lastNoun = n1; this.lastAdj = a1; }
      this.lastVerb = verb;
      const f = this.flags;
      f[F.VERB] = verb; f[F.NOUN1] = n1; f[F.ADJ1] = a1; f[F.NOUN2] = n2; f[F.ADJ2] = a2;
      f[F.PREP] = prep; f[F.ADVERB] = adv;
      return true;
    }

    // ---------------------------------------------------------- tablas de proceso
    match(entry) {
      const v = entry.v, n = entry.n, f = this.flags;
      return (v === NONE || v === 1 || v === f[F.VERB]) && (n === NONE || n === 1 || n === f[F.NOUN1]);
    }
    /**
     * Ejecuta una tabla de proceso. Devuelve true si algún condacto de acción
     * se ejecutó (equivalente al "done" de PAW). DONE termina la tabla.
     */
    async runTable(num, startEntry = 0) {
      const table = this.db.procs[num] || [];
      let did = false;
      for (let i = startEntry; i < table.length; i++) {
        const entry = table[i];
        if (!this.match(entry)) continue;
        const r = await this.runEntry(entry, num, i);
        if (r === 'done') return true;
        if (r === 'did') did = true;
      }
      return did;
    }
    /** Ejecuta los condactos de una entrada. 'fail' | 'did' | 'done' | 'cont' */
    async runEntry(entry, tnum, idx) {
      let did = false;
      for (const c of entry.c) {
        const r = await this.condact(c, tnum, idx);
        if (r === false) return did ? 'did' : 'fail';
        if (r === 'done') return 'done';
        if (r === 'skip') return did ? 'did' : 'fail';   // PARSE con éxito
        if (r === 'act') did = true;
      }
      return did ? 'did' : 'cont';
    }

    /** Ejecuta un condacto. true = condición cumplida, false = falla, 'act' = acción, 'done' = DONE */
    async condact(c, tnum, idx) {
      const [op, a, b] = c;
      const f = this.flags, ol = this.objloc;
      const loc = () => f[F.LOC];
      switch (op) {
        // ---- condiciones
        case 'AT': return loc() === a;
        case 'NOTAT': return loc() !== a;
        case 'ATGT': return loc() > a;
        case 'ATLT': return loc() < a;
        case 'PRESENT': return this.isPresent(a);
        case 'ABSENT': return !this.isPresent(a);
        case 'WORN': return ol[a] === L.WORN;
        case 'NOTWORN': return ol[a] !== L.WORN;
        case 'CARRIED': return ol[a] === L.CARRIED;
        case 'NOTCARR': return ol[a] !== L.CARRIED;
        case 'CHANCE': return Math.random() * 100 < a;
        case 'ZERO': return f[a] === 0;
        case 'NOTZERO': return f[a] !== 0;
        case 'EQ': return f[a] === b;
        case 'NOTEQ': return f[a] !== b;
        case 'GT': return f[a] > b;
        case 'LT': return f[a] < b;
        case 'SAME': return f[a] === f[b];
        case 'NOTSAME': return f[a] !== f[b];
        case 'ADJECT1': return f[F.ADJ1] === a;
        case 'ADJECT2': return f[F.ADJ2] === a;
        case 'ADVERB': return f[F.ADVERB] === a;
        case 'PREP': return f[F.PREP] === a;
        case 'NOUN2': return f[F.NOUN2] === a;
        case 'ISAT': return ol[a] === (b === L.HERE ? loc() : b);
        case 'ISNOTAT': return ol[a] !== (b === L.HERE ? loc() : b);
        case 'WEIGHT_LT': return this.carriedWeight() < a;
        // ---- acciones
        case 'INVEN': {
          const c1 = this.objsAt(L.CARRIED), c2 = this.objsAt(L.WORN);
          await this.out(this.sys(9));
          if (!c1.length && !c2.length) await this.out(this.sys(11));
          for (const o of c1) await this.out(this.db.objs[o].text + '.\n');
          for (const o of c2) await this.out(this.db.objs[o].text + this.sys(10) + '\n');
          return 'done';
        }
        case 'DESC': throw new Signal('desc');
        case 'QUIT': {
          await this.sysmess(12);
          const k = normalize(await this.io.input(true));
          if (!k.startsWith(this.sys(30).trim()[0] || 'S')) return 'done';
          return 'act';
        }
        case 'END': throw new Signal('end');
        case 'DONE': return 'done';
        case 'NOTDONE': return 'done';
        case 'OK': await this.sysmess(15); return 'done';
        case 'ANYKEY': await this.io.anykey(this.sys(16)); return 'act';
        case 'SAVE': {
          const ok = await this.io.store('quijote-save', JSON.stringify({ f: this.flags, o: this.objloc }));
          await this.sysmess(ok === false ? 54 : 15);
          return 'done';
        }
        case 'LOAD': {
          const s = await this.io.store('quijote-save');
          if (!s) { await this.sysmess(55); return 'done'; }
          const d = JSON.parse(s);
          this.flags = d.f; this.objloc = d.o;
          throw new Signal('desc');
        }
        case 'RAMSAVE': this.ramsave = { f: this.flags.slice(), o: this.objloc.slice() }; return 'act';
        case 'RAMLOAD':
          if (!this.ramsave) { await this.sysmess(55); return 'done'; }
          this.flags = this.ramsave.f.slice(); this.objloc = this.ramsave.o.slice();
          return 'act';
        case 'TURNS': {
          const t = f[F.TURNS_LO] + 256 * f[F.TURNS_HI];
          await this.out(this.sys(17) + t + this.sys(18) + (t === 1 ? '' : this.sys(19)) + this.sys(20));
          return 'act';
        }
        case 'SCORE': await this.out(this.sys(21) + this.percent() + this.sys(22)); return 'act';
        case 'CLS': await this.io.cls(); return 'act';
        case 'DROPALL':
          for (let i = 0; i < ol.length; i++) if (ol[i] === L.CARRIED || ol[i] === L.WORN) ol[i] = loc();
          return 'act';
        case 'AUTOG': case 'AUTOD': case 'AUTOW': case 'AUTOR': {
          const pref = { AUTOG: [loc(), L.CARRIED, L.WORN], AUTOD: [L.CARRIED, L.WORN, loc()],
            AUTOW: [L.CARRIED, L.WORN, loc()], AUTOR: [L.WORN, L.CARRIED, loc()] }[op];
          const o = this.findObj(f[F.NOUN1], f[F.ADJ1], pref);
          if (o < 0) { await this.sysmess(op === 'AUTOG' ? 26 : 28); return 'done'; }
          return await this.condact([{ AUTOG: 'GET', AUTOD: 'DROP', AUTOW: 'WEAR', AUTOR: 'REMOVE' }[op], o]);
        }
        case 'AUTOP': case 'AUTOT': {
          const o = this.findObj(f[F.NOUN1], f[F.ADJ1], op === 'AUTOP' ? [L.CARRIED, L.WORN, loc()] : [a]);
          if (o < 0) { await this.sysmess(op === 'AUTOP' ? 28 : 52); if (op === 'AUTOT') await this.out(this.db.objs[a].text + this.sys(51)); return 'done'; }
          return await this.condact([op === 'AUTOP' ? 'PUTIN' : 'TAKEOUT', o, a]);
        }
        case 'GET': {
          f[F.OBJREF] = a;
          if (ol[a] === L.CARRIED || ol[a] === L.WORN) { await this.sysmess(25); return 'done'; }
          if (ol[a] !== loc()) { await this.sysmess(26); return 'done'; }
          if (this.carriedWeight() + this.weight(a) > f[F.MAXWEIGHT]) { await this.sysmess(43); return 'done'; }
          if (this.countCarried() >= f[F.MAXOBJ]) { await this.sysmess(27); return 'done'; }
          ol[a] = L.CARRIED; await this.sysmess(36); return 'act';
        }
        case 'DROP': {
          f[F.OBJREF] = a;
          if (ol[a] === L.WORN) { await this.sysmess(24); return 'done'; }
          if (ol[a] !== L.CARRIED) { await this.sysmess(28); return 'done'; }
          ol[a] = loc(); await this.sysmess(39); return 'act';
        }
        case 'WEAR': {
          f[F.OBJREF] = a;
          if (ol[a] === L.WORN) { await this.sysmess(29); return 'done'; }
          if (ol[a] !== L.CARRIED) { await this.sysmess(28); return 'done'; }
          if (!this.db.objs[a].wear) { await this.sysmess(40); return 'done'; }
          ol[a] = L.WORN; await this.sysmess(37); return 'act';
        }
        case 'REMOVE': {
          f[F.OBJREF] = a;
          if (ol[a] !== L.WORN) { await this.sysmess(23); return 'done'; }
          if (this.countCarried() >= f[F.MAXOBJ]) { await this.sysmess(42); return 'done'; }
          ol[a] = L.CARRIED; await this.sysmess(38); return 'act';
        }
        case 'PUTIN': {   // PUTIN obj contenedor
          f[F.OBJREF] = a;
          if (ol[a] !== L.CARRIED) { await this.sysmess(28); return 'done'; }
          if (a === b) { await this.sysmess(8); return 'done'; }
          ol[a] = b; await this.out(this.sys(44).replace('_', this.db.objs[a].text) + this.db.objs[b].text + this.sys(51));
          return 'act';
        }
        case 'TAKEOUT': {
          f[F.OBJREF] = a;
          if (ol[a] !== b) { await this.out(this.sys(45).replace('_', this.db.objs[a].text) + this.db.objs[b].text + this.sys(51)); return 'done'; }
          if (this.countCarried() >= f[F.MAXOBJ]) { await this.sysmess(27); return 'done'; }
          ol[a] = L.CARRIED; await this.sysmess(36); return 'act';
        }
        case 'DESTROY': ol[a] = L.NOTCREATED; return 'act';
        case 'CREATE': ol[a] = loc(); return 'act';
        case 'SWAP': { const t = ol[a]; ol[a] = ol[b]; ol[b] = t; return 'act'; }
        case 'PLACE': ol[a] = b === L.HERE ? loc() : b; return 'act';
        case 'PAUSE': await this.io.pause(a * 20); return 'act';
        case 'GOTO': f[F.LOC] = a; return 'act';
        case 'MESSAGE': await this.out(this.msg(a) + '\n'); return 'act';
        case 'MES': await this.out(this.msg(a)); return 'act';
        case 'SYSMESS': await this.sysmess(a); return 'act';
        case 'NEWLINE': await this.out('\n'); return 'act';
        case 'PRINT': await this.out(String(f[a])); return 'act';
        case 'SET': f[a] = 255; return 'act';
        case 'CLEAR': f[a] = 0; return 'act';
        case 'LET': f[a] = b; return 'act';
        case 'PLUS': f[a] = Math.min(255, f[a] + b); return 'act';
        case 'MINUS': f[a] = Math.max(0, f[a] - b); return 'act';
        case 'ADD': f[b] = Math.min(255, f[b] + f[a]); return 'act';

 "You are in your library. There are books of chivalry everywhere: on the shelves, on the chairs, on the floor and, above all, in your head. You sold many acres of good arable land to buy them. The only door leads east, to the hall.", "pic": 8}, {"text": "You are in the hall of your house, the house of a gentleman of the sort that keeps a lance in the rack, an old buckler, and a pot with rather more beef than mutton in it. To the west is the library, to the north your bedchamber, to the east the kitchen and to the south the entrance. A narrow stair goes up to the attic.", "pic": 5}, {"text": "Your bedchamber: a narrow bed, a pine chest at its foot and a barred window giving onto the street. The door leads south, to the hall.", "pic": 5}, {"text": "The kitchen. A pot boils on the fire. On the wall there is a cupboard where the housekeeper keeps the food and, while she is about it, the keys of the whole house. The hall lies to the west.", "pic": 5}, {"text": "The attic, full of dust and junk. In a corner, forgotten, lie the arms of your great-grandfathers. A stair goes down to the hall.", "pic": 5}, {"text": "The entrance. The front door opens onto the street, to the south. To the east is the yard, and to the north the hall.", "pic": 5}, {"text": "The yard of your house. Rocinante lives here, if you can call that living. To the east there is a back door that opens onto the fields. The entrance lies to the west.", "pic": 6}, {"text": "The street of your village, asleep. Above you is the window of your bedchamber. The house is locked up tight. The road leaves the village to the east.", "pic": 1}, {"text": "The ancient and famous plain of Montiel. The sun beats down so fiercely that it would melt your brains, if you had any left. The back door of your yard lies to the west and the road goes on to the east.", "pic": 0}, {"text": "You ride almost all day without anything happening worth the telling, which drives you to despair. The road goes on to the east. In the distance, as evening falls, an inn can be seen.", "pic": 0}, {"text": "Before you rises an inn. That is to say: a castle with its four towers and pinnacles of shining silver, with its drawbridge and deep moat. That is what you see. The door of the inn is to the east and, through a gap in the wall, you can reach the yard to the north. The road goes on to the south.", "pic": 9}, {"text": "The inside of the inn, which you call a castle. A few tables, a bench, a smell of salt cod and cheap wine. The way out is to the west.", "pic": 5}, {"text": "The inn yard. Next to a well there is a trough where the carriers water their mules. It is the perfect place to keep vigil over your arms, since the chapel, according to the castellan, has been pulled down to be built anew. The way out is to the south.", "pic": 9}, {"text": "The edge of a wood. The road from the inn lies to the north. From the thicket, to the east, come faint cries, as of someone in distress.", "pic": 2}, {"text": "A clearing in the wood with a great oak in the middle. The road goes on to the east and back to the west.", "pic": 2}, {"text": "You come to a place where the road divides in four. You remember the crossroads where knights errant used to stop and consider which of the roads they would take.", "pic": 0}, {"text": "A broad road along which comes a crowd of people: six Toledan merchants on their way to buy silk in Murcia, with their sunshades, four servants on horseback and three mule boys on foot.", "pic": 0}, {"text": "You leave the village without a word of farewell, you to your niece and housekeeper, Sancho to his wife and children. Sancho rides his ass like a patriarch, with his saddlebags and his wineskin. The road goes on to the east.", "pic": 1}, {"text": "Dawn on the plain of Montiel. Sancho asks you, for the third time, about the island. To the east, some enormous shapes stand out on the horizon.", "pic": 0}, {"text": "You are in the middle of the plain, facing thirty or forty windmills. Or thirty or forty monstrous giants, depending on whom you ask. A road goes down to the south.", "pic": 10}, {"text": "A grove of oaks where you spend the night. Sancho sleeps like a log after several visits to the wineskin. You do not close your eyes, thinking of Dulcinea, as your books require. To the east runs the road to Puerto Lápice.", "pic": 2}, {"text": "The road to Puerto Lápice, which by your reckoning is a much travelled place, full of many and varied adventures. The road goes on to the east.", "pic": 0}, {"text": "Toledo. The Alcaná market. You are now the second author of this history (don't ask) and you are desperately looking for the rest of the manuscript. A boy has come to sell some old notebooks and papers to a silk merchant. In the shade, a Morisco who reads Arabic is dozing.", "pic": 7}, {"text": "A goatherds' camp. Round the fire, six of them are stewing salt goat meat in a cauldron. There is a lot of rosemary growing here. The road goes back to the west and on to the east.", "pic": 2}, {"text": "A meadow full of fresh grass, beside which runs a gentle, cool stream. It is the hour of the siesta. The road goes on to the east.", "pic": 0}, {"text": "An inn in the middle of the road. You say it is a castle; Sancho says it is an inn; the innkeeper, Juan Palomeque the Left-handed, says you will talk about the bill later. The door is to the north. The road goes on to the east.", "pic": 9}, {"text": "The kitchen of the inn, with its fire and its smell of frying. A stair goes up to a garret. To the east is the yard and the way out is to the south.", "pic": 5}, {"text": "A garret that, by the smell of it, has served as a hayloft for many years. There are three beds: yours, four badly planed boards on two uneven benches; a carrier's; and Sancho's, which is a mat.", "pic": 5}, {"text": "The yard of the inn. A large blanket is hanging out to dry, the kind that is used for... better not think about it. The walls are not very high. The kitchen lies to the west.", "pic": 6}, {"text": "A broad, dusty plain. The inn lies to the west. The road goes on to the east.", "pic": 0}, {"text": "Night falls on you in the middle of the road, with no idea where to find shelter. The road goes on to the east.", "pic": 1}, {"text": "A dark valley among tall trees. You can hear a great noise of water and, in time with it, some fearful blows, with a clanking of iron and chains. The night is so black that nothing can be seen. The din comes from the east.", "pic": 3}, {"text": "A meadow at the foot of some rocks, where a stream drives six fulling hammers that pound a length of cloth with alternating blows. The road goes on to the east.", "pic": 2}, {"text": "A highroad. It is beginning to drizzle. The road goes on to the east.", "pic": 0}, {"text": "The highroad, which to the south plunges into the wilds of the Sierra Morena.", "pic": 0}, {"text": "The wilds of the Sierra Morena. Crags, rockroses and not a soul. The Holy Brotherhood will not find you here. Nor will anybody else, for that matter. The way goes on to the south.", "pic": 4}, {"text": "A valley hidden among the crags of the sierra. To the east a stream runs down.", "pic": 4}, {"text": "At the foot of a high mountain runs a gentle stream, and the meadow is so green and lush that it gladdens the eyes. There are many trees. It is the perfect place to go mad. Well, madder.", "pic": 4}, {"text": "You are travelling, shut in a cage of wooden bars on an ox cart, on the way to your village. In front go the curate and the barber, in disguise (very bad disguise). The oxen go slowly. Very slowly.", "pic": 0}, {"text": "Your bedchamber. You have spent nearly a month in this bed, so dried up and withered that you look like nothing so much as a mummy. The door leads south, to the hall.", "pic": 5}, {"text": "The hall of your house. On the rack, as always, there is room for a lance. To the north is your bedchamber and to the south the way out to the yard. Where the library used to be, the whitewashed wall is still there.", "pic": 5}, {"text": "The yard of your house. Rocinante, who has put on a little weight this month, is feeling it in his soul. The back door, unnailed long ago, opens onto the fields to the east. The hall lies to the north.", "pic": 6}, {"text": "The road to El Toboso. The two of you ride alone, unseen: you talking of Dulcinea and Sancho trembling, because he has never seen her in his life and he knows it. To the east a huddle of houses can be seen.", "pic": 1}, {"text": "The great city of El Toboso, at midnight. Nothing is heard in the whole place but the barking of dogs, which deafens the ears: now and then an ass brays, pigs grunt and cats mew. To the north rises a great building; to the east a narrow lane runs off; to the south, outside the town, there is an oak grove. The road goes back to the west.", "pic": 11}, {"text": "A great tower casting its shadow in the middle of the night. You were looking for a palace. This is the parish church. The square lies to the south.", "pic": 11}, {"text": "A narrow, dark blind alley. There are no palaces or alcazars here, only the low houses of farm folk. The square lies to the west.", "pic": 11}, {"text": "An oak grove half a league from El Toboso. It is daytime. From here you can see the town, to the north, and the road that goes on to the east.", "pic": 2}, {"text": "A broad road between vineyards. The road goes back to the west, to the oak grove, and on to the east.", "pic": 0}, {"text": "A dark night under some tall, shadowy trees. You have dismounted to sleep. Very close, at the foot of a tree, someone is sighing for love and tuning a lute. The road goes on to the east.", "pic": 3}, {"text": "A highroad, within sight of the house of the Knight of the Green Coat, Don Diego de Miranda, who is riding with you. Along it comes a cart flying the king's flags. The road goes on to the east.", "pic": 12}, {"text": "A meadow at the edge of a village, turned into a kitchen. There is a whole bullock spitted on an elm trunk, six pots as big as wine jars and mountains of white bread. It all belongs to Camacho the rich, who is getting married today. To the north, under a bower, the wedding is being held. The road goes on to the east.", "pic": 13}, {"text": "A bower of trees decorated as for a feast. Here are the bride and groom, the priest and half the village. The meadow with the pots lies to the south.", "pic": 13}, {"text": "The mouth of the cave of Montesinos, wide and spacious, but full of boxthorn, wild fig, brambles and briars, so thick and tangled that they completely blind and cover it. The road goes back to the west, to the wedding, and on to the east.", "pic": 14}, {"text": "It is as dark as a wolf's mouth. You hang from the rope, which Sancho and the cousin are paying out little by little. You can keep going down.", "pic": -1}, {"text": "A black, damp passage. The echo gives you back your own voice, calling for Dulcinea. There are galleries in every direction.", "pic": -1}, {"text": "Another passage, as black as the last. Or it is the same one. There are galleries in every direction.", "pic": -1}, {"text": "A hollow in one side of the cave, big enough to hold a cart with its mules. A little light comes in through some cracks. There are galleries in every direction.", "pic": -1}, {"text": "A meadow, the loveliest that nature could create. In the middle of it rises a royal and splendid palace whose walls seem to be built of clear crystal. Out of its doors comes a venerable old man in a hooded cloak of purple baize: Montesinos.", "pic": 15}, {"text": "An inn, which this time, by some miracle, you take for an inn. In the yard Master Pedro, a puppeteer with a patch of green taffeta covering half his face, has set up his show. On his shoulder he carries a tailless ape. The road goes on to the east.", "pic": 9}, {"text": "The banks of the Ebro, with gentle, plentiful waters. By the bank, tied to the trunk of a tree, there is a small boat without oars or any other tackle. The road goes on to the east.", "pic": 16}, {"text": "You are in the enchanted boat, drifting slowly downstream, without oars or sails. You say you have sailed seven or eight hundred leagues. Sancho says he can still see Rocinante and the dapple on the bank. Ahead, some great watermills stand in the middle of the river.", "pic": 16}, {"text": "A green meadow at the edge of a wood, at sunset. There is a hunting party: a gallant lady on a snow-white palfrey, with a hawk on her left hand. A great lady. The road goes on to the east, to a castle.", "pic": 2}, {"text": "The courtyard of the dukes' castle. This is the first time you know and believe yourself to be a real knight errant, and not an imaginary one. To the north is the great hall and to the east the garden. The road leaves to the south.", "pic": 17}, {"text": "A great hall hung with very rich cloth of gold and brocade. The table is laid. The dukes are dining with a grave ecclesiastic, one of those who rule the households of princes. The courtyard lies to the south.", "pic": 5}, {"text": "The castle garden, as evening falls. Fountains, mazes of myrtle and a few servants who hide their laughter very badly. The courtyard lies to the west.", "pic": 17}, {"text": "The island of Barataria, which is a town of about a thousand souls, one of the best the duke owns. As for being an island, it isn't much of one: it has no sea. To the north is the courthouse, to the east the governor's palace and to the west the streets of the town.", "pic": 18}, {"text": "The courtroom. They seat you in the judge's chair. On the wall there are letters saying that on such a day the lord Don Sancho Panza took possession of this island. The way out is to the south.", "pic": 5}, {"text": "A room in the palace, with a royal and spotless table. Beside you, standing, is a personage with a whalebone wand in his hand: Doctor Pedro Recio de Agüero, native of Tirteafuera. To the north is your bedchamber and to the west the square.", "pic": 5}, {"text": "The governor's bedchamber: a soft bed, so soft you don't trust it. The way out is to the south.", "pic": 5}, {"text": "The streets of the island, at night. You are making the rounds with the steward, the secretary, the head carver and a chronicler who writes everything down. The square lies to the east.", "pic": 1}, {"text": "A road half a league from the dukes' castle. On one side a deep, dark pit opens up. The castle lies to the north and the road goes on to the east, towards Barcelona.", "pic": 0}, {"text": "Barcelona: the treasure house of courtesy, the shelter of strangers, the refuge of the poor, the home of the valiant. You are staying with Don Antonio Moreno, a rich and discreet gentleman, in his house. To the south is the way down to the beach.", "pic": 19}, {"text": "The beach of Barcelona. You see the sea, which you had never seen before: it seems to you vast and wide, far bigger than the lakes of Ruidera. In the harbour there are galleys with pennants and streamers. The city lies to the north.", "pic": 19}, {"text": "The road back to La Mancha. You ride unarmed and as a traveller; Sancho goes on foot, because the dapple carries your armour, like a trophy in reverse. The road goes on to the west.", "pic": 0}, {"text": "A crossroads within sight of El Toboso. From here you can see the tower of the church you came upon that night. To the north, among olive trees, runs the road to El Toboso; to the west, the road to your village.", "pic": 11}, {"text": "You find yourself before two girls: one richly dressed, like a princess; the other is a peasant. Both say they are Dulcinea del Toboso.", "pic": 11}, {"text": "The edge of your village. Some boys are quarrelling on the threshing floors, and a hare runs past, fleeing from some greyhounds, and hides under the dapple. Your house is to the north.", "pic": 1}], "conns": [[], [], [], [[3, 4]], [[4, 3], [13, 5], [3, 6], [2, 8], [9, 7]], [[2, 4]], [[4, 4]], [[10, 4]], [[13, 4], [3, 9]], [[4, 8]], [], [[4, 9], [3, 12]], [[4, 11], [3, 13]], [[4, 12], [3, 14], [11, 14], [13, 15], [2, 16]], [[4, 13], [12, 13]], [[2, 13]], [[13, 13], [3, 17]], [[4, 16], [3, 18]], [[4, 17]], [], [[3, 21]], [[4, 20], [3, 22]], [[4, 21], [2, 23]], [[13, 22], [3, 24]], [[4, 23], [3, 26]], [], [[4, 24], [3, 27]], [[4, 26], [3, 28]], [[13, 29], [11, 29], [4, 27], [3, 32]], [[2, 28], [12, 28], [9, 30], [3, 31]], [[10, 29]], [[4, 29]], [[4, 28], [3, 33]], [[4, 32], [3, 34]], [[4, 33], [3, 35]], [[4, 34], [3, 36]], [[4, 35], [3, 37]], [[4, 36], [2, 38]], [[13, 37], [2, 39]], [[13, 38], [3, 40]], [[4, 39]], [], [[2, 43]], [[13, 42], [2, 44]], [[13, 43], [3, 45]], [[3, 46]], [[4, 45], [13, 47], [3, 48], [2, 49]], [[2, 46]], [[4, 46]], [[13, 46], [3, 50]], [[4, 49], [3, 51]], [[4, 50], [3, 52]], [[4, 51], [3, 53]], [[13, 54], [4, 52], [3, 55]], [[2, 53]], [[4, 53], [3, 61], [10, 56]], [[9, 55], [10, 57]], [[9, 56], [13, 57], [2, 56], [4, 57], [3, 58]], [[4, 57], [2, 58], [3, 57], [13, 59]], [[2, 58], [13, 58], [3, 57], [4, 59]], [], [[4, 55], [3, 62]], [[4, 61], [3, 64], [11, 63]], [], [[4, 62], [3, 65]], [[13, 66], [3, 67], [2, 73]], [[2, 65]], [[4, 65]], [[13, 69], [3, 70], [4, 72]], [[2, 68]], [[4, 68], [13, 71]], [[2, 70]], [[3, 68]], [[13, 65], [3, 74]], [[2, 75], [4, 73]], [[13, 74]], [[4, 77]], [[3, 76], [4, 79]], [], [[3, 77], [13, 42]]], "objs": [{"text": "the saddlebags", "loc": 252, "noun": 52, "adj": 255, "w": 1, "wear": false, "cont": true}, {"text": "the lance", "loc": 4, "noun": 23, "adj": 255, "w": 2, "wear": false, "cont": false}, {"text": "the buckler", "loc": 4, "noun": 24, "adj": 255, "w": 2, "wear": false, "cont": false}, {"text": "your great-grandfathers' corselet", "loc": 7, "noun": 25, "adj": 255, "w": 2, "wear": true, "cont": false}, {"text": "the helmet", "loc": 7, "noun": 26, "adj": 255, "w": 1, "wear": true, "cont": false}, {"text": "the sword", "loc": 7, "noun": 27, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the iron bars", "loc": 7, "noun": 28, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the pasteboard covers", "loc": 252, "noun": 22, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the key", "loc": 252, "noun": 30, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the purse of ducats", "loc": 252, "noun": 33, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the clean shirt", "loc": 252, "noun": 34, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the sheet", "loc": 5, "noun": 35, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the sheet ladder", "loc": 252, "noun": 36, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the iron tip of the lance", "loc": 252, "noun": 67, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the dry oak branch", "loc": 252, "noun": 68, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the half real", "loc": 252, "noun": 72, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the notebooks in Arabic", "loc": 252, "noun": 73, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the rosemary", "loc": 26, "noun": 77, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the salt", "loc": 252, "noun": 78, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the oil", "loc": 252, "noun": 82, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the wine", "loc": 252, "noun": 83, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the tin oil flask", "loc": 29, "noun": 85, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the balsam of Fierabras (in its flask)", "loc": 252, "noun": 86, "adj": 255, "w": 1, "wear": false, "cont": false}, {"text": "the helmet of Mambrino (which Sancho insists on calling a basin)", "loc": 252, "noun": 93, "adj": 255, "w": 1, "wear": true, "cont": false}, {"text": "the notebook", "loc": 252, "noun": 99, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the cloth rosary", "loc": 252, "noun": 101, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the four reals", "loc": 252, "noun": 33, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "the hundred-fathom rope", "loc": 252, "noun": 112, "adj": 255, "w": 2, "wear": false, "cont": false}, {"text": "the jewel", "loc": 252, "noun": 127, "adj": 255, "w": 0, "wear": false, "cont": false}, {"text": "a holland handkerchief", "loc": 66, "noun": 149, "adj": 255, "w": 0, "wear": true, "cont": false}, {"text": "the old man's staff", "loc": 252, "noun": 153, "adj": 255, "w": 1, "wear": false, "cont": false}], "msgs": ["\u00106\u00131   DON QUIXOTE OF LA MANCHA\u00130\u00107\n\n\u00105       (c) AVENTURAS LEVEL 10\u00107\n\nProgram and graphics:\n\u00106Jorge Louzao Penalva\u00107\nWith the help of:\nAngel Louzao Penalva\nLuis Gabaldón Alvarez\n\u00104   1989 version - 2026 remake\u00107", "In a village of La Mancha, the name of which I have no desire to call to mind, there lived not long since one of those gentlemen that keep a lance in the lance-rack, an old buckler, a lean hack, and a greyhound for coursing...\nOur gentleman was nearly fifty. In his idle moments, which were most of the year, he gave himself up to reading books of chivalry with such ardour and delight that he almost entirely neglected the management of his estate.", "\u00105Type commands such as GET LANCE, EXAMINE ROCINANTE, N, S, E, W, UP, DOWN or SAY TO SANCHO \"HELLO\". Other useful ones: I (inventory), LOOK, EXITS, HELP, SAVE, LOAD, SCORE.\u00107", "You open a book by Feliciano de Silva and read: \u00106\"The reason of the unreason with which my reason is afflicted so weakens my reason that with reason I murmur at your beauty.\"\u00107\nYou read from dusk till dawn and from dawn till dusk until, from little sleep and much reading, your brain dries up and you lose your wits. You decide to become a knight errant and roam the world with your arms and your horse in search of adventures.", "Four days go by while you think what name to give your hack, who has more cracks in his hoofs than a real has quarters, and more blemishes than the steed of Gonela. After many names that you devise, erase and reject, you call him \u00106ROCINANTE\u00107: a name lofty, sonorous and significant.", "It takes you eight more days to name yourself. In the end you call yourself \u00106DON QUIXOTE\u00107 and, as the valiant Amadis added the name of his kingdom, you add the name of your country: \u00106DON QUIXOTE OF LA MANCHA\u00107.", "A knight errant without a lady is a tree without leaves or fruit. In a village near your own there is a very good-looking farm girl, Aldonza Lorenzo, with whom you were in love for a time (though she never knew it or gave it a thought). You call her \u00106DULCINEA DEL TOBOSO\u00107.", "One morning before dawn, on one of the hottest days of July, you arm yourself with all your armour, mount Rocinante, brace your buckler, take up your lance and ride out through the back door of the yard into the open country, in the greatest contentment and delight.", "Scarcely are you out in the fields when a terrible thought strikes you: you have not been dubbed a knight! By the law of chivalry you neither can nor ought to bear arms against any knight. You resolve to have yourself dubbed by the first person you meet.", "At the door stand two young women, of the sort they call ladies of the road. Just then a swineherd blows a horn to gather his pigs, and you take him for a dwarf announcing your arrival. The girls, seeing you in armour, take fright. \u00104\"Fly not, your ladyships, nor fear any discourtesy,\"\u00107 you tell them. Hearing themselves called ladies, they cannot keep from laughing. Out comes the innkeeper, a man so fat that he is very peaceable.", "\u00106\"Your worship has done well to come to this castle to ask that boon. But the chapel has been pulled down to be built anew, so the arms may be watched in the yard, beside the trough. Tomorrow, God willing, the due ceremonies will be performed.\"\u00107\nThen he asks whether you have any money. You tell him you have not a farthing, for you have never read that knights errant carried any. \u00106\"Your worship is mistaken: though the histories do not write it down, they carried well-lined purses, and clean shirts, and a little box of ointments to cure their wounds. And a squire.\"\u00107", "You brace your buckler, grasp your lance and, with a noble bearing, begin to pace up and down in front of the trough, where you have laid your arms. The moon shines so brightly that everything you do is seen by everyone. The people of the inn come out to watch.", "A carrier comes to the trough to water his mules and, to do so, moves your arms aside. \u00104\"O thou, whoever thou art, rash knight, look to what thou doest and touch them not!\"\u00107", "You raise your lance in both hands and deal the carrier such a blow on the head that you lay him on the ground, so battered that, had a second followed, he would have needed no surgeon. You gather up your arms and resume your pacing as calmly as before.", "Another carrier, not knowing what has happened (for the first still lies stunned), comes with the same intention of watering his mules, and starts to take the arms off the trough.", "Without a word you raise your lance again and break his head, not in two but in four. At the noise the whole inn comes running. The companions of the wounded men begin to rain stones on you from a distance, and you shelter behind your buckler.", "The innkeeper, who wants no more trouble, decides to cut things short. He brings the book in which he enters the straw and barley he serves to the carriers and, with a candle end held by a boy and the two damsels, comes to you. He bids you kneel, reads from his manual as if he were saying some devout prayer, gives you a sound blow on the neck and a fine slap on the back with your own sword.\nOne of the girls girds on your sword. You ask her name: she is called La Tolosa, daughter of a cobbler of Toledo. You beg her to call herself Doña Tolosa from now on. The other buckles on your spur; she is called La Molinera, and shall be Doña Molinera. \u00106You are now a dubbed knight!\u00107", "Tied to an oak is a boy of about fifteen, stripped from the waist up, and a sturdy farmer is flogging him with a belt. Each lash comes with a rebuke and a piece of advice: \u00106\"Your tongue still and your eyes open!\"\u00107", "You set your lance at the farmer's breast: \u00104\"Discourteous knight, it ill becomes you to assail one who cannot defend himself. Untie him at once and pay him what you owe him, if you would not have me finish and annihilate you this very instant.\"\u00107\nThe farmer, seeing a lance over his face, unties his servant and swears by every order of chivalry that he will pay him to the last real, and perfumed into the bargain. Satisfied, you consider the adventure concluded.", "(What you don't know is that, as soon as you are out of sight, Juan Haldudo ties Andrés to the oak again and gives him so many lashes that he leaves him half dead. Laughing all the while. That was how you righted wrongs.)", "Following the example of the knights errant, you drop the reins and let Rocinante choose the road. Rocinante, who knows little of chivalry but a great deal about fodder, heads straight for his stable.", "You plant Rocinante in the middle of the road and shout: \u00104\"Let all the world stand, unless all the world confess that in all the world there is no maiden fairer than the Empress of La Mancha, the peerless Dulcinea del Toboso!\"\u00107\nOne of the merchants, who likes a joke, answers: \u00106\"Sir knight, show us some portrait of this lady, though it be no bigger than a grain of wheat. And even if it shows her blind of one eye, and distilling vermilion and sulphur from the other, we will say in her favour all that you desire.\"\u00107", "\u00104\"She distils nothing of the kind, vile rabble, but ambergris and civet in cotton!\"\u00107 You lower your lance and charge with such fury that, had not good fortune made Rocinante stumble and fall in the middle of the road, it would have gone hard with the rash merchant.\nYou fall, and however hard you try, there is no getting up: the lance, the buckler, the spurs and the helmet hamper you too much. A mule boy, not too well disposed, takes your lance, breaks it to pieces and with one of them beats you like wheat on a threshing floor.", "A farmer from your own village, Pedro Alonso, comes by on his way back from taking wheat to the mill. He finds you lying there, battered. You, instead of complaining, recite to him the ballad of Valdovinos and the Marquis of Mantua, and then the story of the Moor Abindarráez.\n\u00106\"Look, your worship, sir, sinner that I am, I am not Don Rodrigo de Narváez nor the Marquis of Mantua, but Pedro Alonso your neighbour; and your worship is neither Valdovinos nor Abindarráez, but the worthy gentleman Señor Quijana.\"\u00107\n\u00104\"I know who I am,\"\u00107 you reply.\nHe sets you on his donkey and waits until nightfall to enter the village, so that nobody will see the battered gentleman in such a poor state of knighthood.", "They put you to bed and you fall asleep. While you sleep, the curate of the village, the licentiate Pero Pérez, and the barber, Master Nicholas, go into your library with the housekeeper and the niece to hold a grand and diverting scrutiny of your books.\n\u00105Amadis of Gaul:\u00107 spared, as the best of all the books of its kind.\n\u00105The Exploits of Esplandian:\u00107 out into the yard, for the bonfire.\n\u00105Palmerin of England:\u00107 to be kept as a unique thing.", "\u00105Tirant lo Blanc:\u00107 \"for its style, this is the best book in the world: here knights eat, and sleep, and die in their beds.\"\n\u00105La Galatea, by Miguel de Cervantes:\u00107 \"this Cervantes has been a great friend of mine for many years, and I know he has more experience in reverses than in verses.\"\n\u00105Don Quijote de la Mancha, Aventuras Level 10, 1989, for the Spectrum:\u00107 \"into the fire with it, for nobody can finish it!\"", "To cure you once and for all, the curate and the barber decide to wall up the library, so that when you get up you will not find it; for when the cause is removed, the effect will cease.\nTwo days later you get up.", "Your niece looks as though butter would not melt in her mouth: \u00106\"There is no library, uncle. One night an enchanter came on a cloud, got down from a serpent he was riding, went into the room, and I don't know what he did inside, but after a little while he flew out through the roof and left the house full of smoke. He said he was called the sage Muñatón.\"\u00107\n\u00104\"Freston, you mean,\"\u00107 you correct her. \u00104\"He is a sage enchanter, a great enemy of mine.\"\u00107", "You promise him that, if he comes with you, before he can say knife you will win some island and leave him governor of it. Sancho Panza, for that is the farmer's name, leaves his wife and children and takes service as squire to his neighbour.\n\u00105\"I mean to take an ass I have, a very good one, for I am not much given to going on foot. Tonight, when the house is asleep, I'll wait for your worship in the street with Rocinante, for I'll bring him out through the yard door. And bring money, your worship, for nobody gets anywhere without a penny.\"\u00107\nAnd off he goes, very pleased, to tell his wife the news.", "Out of the cupboard comes a rat that bites you in the jugular and ends your life. Not Amadis, not Palmerin, not Tirant: a rat. \u00102You are dead.\u00107", "Out of the cupboard comes a rat that tries to bite your jugular, but the corselet stops it. The rat, now toothless, runs away. Among the jars in the cupboard you see a key.", "You spend the day pretending to be sane and sensible, which is the hardest thing of all. At last night falls. The housekeeper locks up the house and goes to bed with the key under her pillow. From the street comes a very squire-like whistle.", "Sancho is waiting for you with his dapple and with Rocinante, already saddled. \u00105\"Here are some saddlebags, your worship, for the money and the shirts.\"\u00107 And he leaves them on the ground.", "You set off without taking leave of anybody. You travel so far that night that at daybreak you are sure they will not find you even if they search.", "\u00104\"Fortune is arranging matters for us better than we could have hoped, for look there, friend Sancho Panza, where thirty or more monstrous giants present themselves, all of whom I mean to engage in battle and slay.\"\u00107\n\u00105\"Look, your worship, what we see there are not giants but windmills, and what seem to be their arms are the sails.\"\u00107", "\u00104\"Fly not, cowards and vile beings, for a single knight attacks you!\"\u00107 A slight breeze springs up and the great sails begin to move. \u00104\"Though ye flourish more arms than the giant Briareus, ye have to reckon with me.\"\u00107\nCommending yourself to your lady Dulcinea, well covered by your buckler, lance in rest, you charge at Rocinante's fullest gallop at the first mill. You drive your lance into the sail; the wind whirls it round with such force that it shivers the lance to pieces, sweeping horse and rider along with it, and you go rolling over the plain in a sorry state.", "Sancho hurries to your aid as fast as his ass can go: \u00105\"God bless me! Did I not tell your worship that they were nothing but windmills?\"\u00107\n\u00104\"Hush, friend Sancho, the fortunes of war are more than any other liable to frequent fluctuations. That same sage Freston who carried off my study and books has turned these giants into mills in order to rob me of the glory of vanquishing them.\"\u00107\nOf your lance only the iron tip is left, lying on the ground.", "You fit the iron tip of the broken lance onto the dry branch and fasten it as best you can. You have a lance again. A little crooked, but a lance.", "Along the road come two friars of the order of Saint Benedict, mounted on two dromedaries (for the mules they ride are no smaller), with their travelling spectacles and their sunshades. Behind them comes a coach with four or five men on horseback. In the coach travels a Biscayan lady. It is perfectly clear: those black shapes are enchanters carrying off some princess.", "Without waiting for an answer, you charge the first friar so furiously that, had he not let himself fall off his mule, he would have hit the ground much against his will. The other spurs his castle and flies across the plain swifter than the wind.\nSancho starts to strip the fallen friar of his habit, saying it belongs to him lawfully as the spoils of battle. The friars' servants, who know nothing about spoils, leave him stretched on the ground, breathless and senseless.", "You look into the coach: \u00104\"Your beauty, lady mine, may now dispose of your person as may be most in accordance with your pleasure, for the pride of your ravishers lies prostrate on the ground. I only ask that you go to El Toboso and present yourself before the peerless Dulcinea.\"\u00107\nOne of the squires of the coach, a Biscayan, seizes your lance: \u00106\"Go, caballero, ill go thou; by the God that make me, if coach thou leave not, kill thee as here Biscayan art!\"\u00107\n\u00104\"If thou wert a knight, as thou art none, I should have already chastised thy folly and rashness, miserable creature.\"\u00107\n\u00106\"I no gentleman? I swear to God thou liest as I am Christian.\"\u00107", "The Biscayan takes a cushion from the coach to serve him as a shield. You both raise your keen swords with such resolution that you seem about to cleave the earth in two...\n\u00102But the trouble of it all is that at this very point and crisis the author of the history leaves this battle impending, excusing himself on the ground that he could find nothing more written about these achievements of Don Quixote.\u00107", "The boy sells you all the notebooks for half a real. Leafing through them you see Arabic characters and some drawings: a knight on a hack, long and lank and lean, and at his feet a man with a big belly, a short body and long shanks. Underneath it says: \u00106Sancho Zancas.\u00107", "The Morisco opens a notebook in the middle, reads a little and bursts out laughing. \u00106\"Here in the margin it says: This Dulcinea del Toboso, so often mentioned in this history, had, they say, the best hand of any woman in all La Mancha for salting pigs.\"\u00107\nThe title says: \u00106History of Don Quixote of La Mancha, written by Cide Hamete Benengeli, an Arab historian.\u00107 You promise him two arrobas of raisins and two bushels of wheat to translate the whole of it, and he does it in little more than a month and a half. The history continues...", "...The first to strike is the choleric Biscayan, with such force that, had his sword not turned in its course, that single blow would have been enough to end your fierce combat. But good fortune makes it land on your left shoulder: it takes away a large part of your helmet and half your ear.\nYou rise in your stirrups and, gripping your sword in both hands, bring it down on the Biscayan full on the cushion and the head, so that he begins to bleed from his nose, his mouth and his ears, and falls from his mule.\nThe ladies of the coach beg you for his life, and promise that he will go to El Toboso to present himself before Dulcinea. Promises cost nothing.", "The goatherds receive you kindly and offer you what they have: strips of salted goat, roasted acorns and half a cheese harder than if it had been made of mortar.", "You take a handful of acorns, gaze at them attentively and raise your voice:\n\u00104\"Happy the age, happy the time, to which the ancients gave the name of golden, not because in that fortunate age the gold so coveted in this our iron one was gained without toil, but because they that lived in it knew not the two words mine and thine...\"\u00107\nThe goatherds listen to you open-mouthed and spellbound, without understanding a word. One of them dresses your ear: he takes some rosemary leaves, chews them, mixes them with a little salt and applies them. It works wonders.", "Rocinante, who is not as chaste as his master, as soon as he sees a herd of Galician ponies grazing in the meadow, trots off to make merry with them. But the ponies receive him with hoofs and teeth, and their owners, some carriers from Yanguas, come running with stakes and leave him lying battered on the ground.", "\u00104\"Well may you help me, friend Sancho, to take due vengeance for the outrage that has been done to Rocinante before our very eyes.\"\u00107\nYou draw your sword and the two of you charge twenty Yanguesans. You give the first a slash that lays open a leather jerkin. The rest come up with their stakes and, in the twinkling of an eye, leave you both stretched on the ground beside Rocinante, ground to powder.", "Sancho carries you, slung across the dapple like a sack, to the inn, with Rocinante tied behind. The innkeeper's wife, her daughter and an Asturian wench called Maritornes, broad-faced, flat-headed, snub-nosed, blind of one eye and not very sound in the other, plaster you from top to toe.", "At midnight Maritornes comes groping in, looking for the carrier who is waiting for her, and finds you instead. You take her for the daughter of the lord of the castle who, overcome by your graces, has come to lie with you. You hold her by the wrist and explain, with great courtesy, that your faith belongs to the peerless Dulcinea.\nThe carrier, jealous, deals you a terrible blow on your lantern jaws and then trots up and down your ribs. The bed, which has little to stand on, collapses. Maritornes hides in Sancho's bed, and he takes her for a nightmare and starts handing out punches. The innkeeper comes up with a lamp, and it all ends in the most comical skirmish in the world. To crown it all, an officer of the Holy Brotherhood hits you on the head with the lamp.\nDay breaks. You have two bumps like two almonds.", "You mix the oil, the wine, the salt and the rosemary, boil them for a good while until they seem just right, and pour it all into the flask. You have the balsam of Fierabras. But according to your books it must be blessed before it is taken.", "Over the flask you say more than eighty paternosters and as many ave-marias, salves and credos, and with every word you make a cross by way of blessing. Sancho, the innkeeper and the officer watch you very attentively.", "You drink what the pot would not hold, which will be nearly half a quart. Hardly have you finished drinking it when you begin to vomit so that nothing is left in your stomach, and with the pangs and spasms of the vomiting you break into a profuse sweat. You ask them to wrap you up and leave you alone.\nYou sleep for more than three hours and, when you wake, you feel greatly relieved in body, and so much better of your bruises that you consider yourself cured. You truly believe you have hit upon the balsam of Fierabras. Rocinante, with rest and barley, has also recovered.", "Sancho, who takes his master's recovery for a miracle, drinks what is left in the pot. But poor Sancho's stomach is not as delicate as yours: before he vomits he is seized with such gripings, sweats and faintness that he thinks his last hour has come.\n\u00104\"I believe, Sancho, that all this mischief comes to you from not being dubbed a knight, for I am persuaded this liquor cannot be good for those who are not.\"\u00107\n\u00105\"If your worship knew that, bad luck to me and all my kindred, why did you let me taste it?\"\u00107", "The innkeeper plants himself in the doorway: \u00106\"Sir knight, pay me for the straw and barley for the beasts, the supper and the beds.\"\u00107\n\u00104\"Then this is an inn? I have been deceived, for I thought it was a castle. I cannot contravene the rule of knights errant, of whom I know for certain that they never paid for lodging or anything else.\"\u00107\nAnd without waiting for an answer you spur Rocinante and ride out of the inn with nobody to stop you. Sancho, who has stayed behind, is not so lucky.", "As ill luck would have it, among the people at the inn there are four wool-carders from Segovia, three needle-makers from the Colt of Cordova and two neighbours from the Fair of Seville, lively, well-meaning, mischievous and playful fellows. They put Sancho in the middle of a blanket and begin to toss him up in the air and make sport of him as they would with a dog at Shrovetide.\nYou see him flying above the walls of the yard, going up and coming down with such grace and nimbleness that, if your anger allowed you, you would laugh. When at last they let him go, Maritornes gives him a jug of wine, paid for with her own money. The innkeeper keeps the saddlebags in payment of what was owed him.", "You see a great thick cloud of dust coming along the road, and from the other side another just like it. \u00104\"Seest thou that cloud of dust, Sancho? It is all churned up by a vast army composed of various and countless nations that comes marching there. That knight in the yellow armour is the valiant Laurcalco, lord of the Silver Bridge; the other, the dreaded Micocolembo, grand duke of Quirocia...\"\u00107\n\u00105\"Well, I see nothing of the kind, sir. Maybe it's all enchantment. But I can hear bleating.\"\u00107", "You set spurs to Rocinante and, lance in rest, plunge into the middle of the squadron of sheep, and begin spearing them with as much spirit as if you were truly spearing your mortal enemies.\nThe shepherds, seeing that shouting does them no good, take out their slings and salute you with stones as big as fists. One drives two of your ribs into your body. Another hits you in the hand and the mouth and knocks out three or four teeth and grinders. You fall off your horse. The shepherds gather their flock, load up the dead sheep, of which there are more than seven, and go away.", "Sancho puts his fingers into your mouth: \u00105\"How many grinders used your worship to have on this side?\"\u00107\n\u00104\"Four, besides the back tooth, all whole and very sound.\"\u00107\n\u00105\"Well, on this side your worship has no more than two and a half.\"\u00107", "Along the road comes a great number of lights, which look like nothing so much as moving stars. They are twenty men in white shirts, all on horseback, with lighted torches in their hands, and behind them a litter draped in black. They murmur among themselves in low, plaintive voices. Sancho's teeth chatter like a man with the quartan ague.", "You plant yourself in the middle of the road, couch your lance and charge one of the mourners. The others run off across the fields with their lighted torches, looking like masqueraders on a carnival night. The fallen one turns out to be the bachelor Alonso López, who is taking a dead man to be buried in Segovia and who now has a broken leg, thanks to you.\nSancho, who has seen it all by the light of the torches, gives you a name: \u00105\"If by chance those gentlemen should want to know who the hero was that served them so, your worship may tell them it was the famous Don Quixote of La Mancha, otherwise called the \u00106Knight of the Rueful Countenance\u00105.\"\u00107", "You want to attempt the adventure, but Sancho has slyly tied Rocinante's legs together with his ass's halter. When you spur him, Rocinante can only move in jumps.\n\u00105\"Ah, sir, heaven, moved by my tears and prayers, has ordained that Rocinante cannot stir. Let us wait for daylight.\"\u00107", "\u00105\"There was a goatherd called Lope Ruiz, in love with a shepherdess called Torralba... Lope Ruiz came with his three hundred goats to cross the river Guadiana, and there was no boat but a fisherman's little one, that held only one goat. The fisherman took one goat across; he came back and took another; he came back again and took another. Your worship must keep count of the goats the fisherman is taking over, for if one slips from memory the story is at an end. How many goats has he taken over so far?\"\u00107\n\u00104\"How should I know?\"\u00107\n\u00105\"Then there the story ends.\"\u00107\nBetween goats and stories, the day begins to break.", "Dawn comes. Sancho, very quietly, unties Rocinante's legs, and all of a sudden he can move again as if nothing had happened.", "By the light of day you discover the cause of that dreadful and terrifying noise: six fulling hammers. Sancho holds back his laughter with puffed-out cheeks. Then he stops holding it back.\n\u00105\"Thou must know, O Sancho my friend, that I was born, by Heaven's will, in this our iron age to revive in it the age of gold...\"\u00107, Sancho repeats, imitating you.\nYou give him two whacks with your lance that, had they fallen on his head as they fall on his shoulders, would have freed you from paying his wages.", "Along the road comes a man on horseback wearing on his head something that shines as if it were gold. \u00104\"Dost thou not see yonder knight coming towards us on a dappled grey steed, who has upon his head the helmet of Mambrino?\"\u00107\n\u00105\"What I see is a man on a grey ass like my own, with something on his head that shines.\"\u00107 (It is a barber who has put his basin on his head so that the rain will not spoil his hat.)", "You charge the barber at Rocinante's full gallop, lance low: \u00104\"Defend thyself, miserable being, or yield me of thine own accord that which is so reasonably my due!\"\u00107\nThe barber, seeing that apparition bearing down on him, lets himself fall off his ass and, no sooner has he touched the ground than he is up again, nimbler than a deer, and running across the plain faster than the wind could follow. The basin stays on the ground. Sancho, for his part, swaps the trappings of his ass for the barber's. \u00105\"Mutatio capparum,\"\u00107 he says, very refined.", "Along the road come twelve men on foot, strung together like beads on a great iron chain by the neck, and all with manacles on their hands. They are guarded by two men on horseback with muskets and two on foot with javelins and swords. \u00105\"This is a chain of galley slaves, men forced by the king to go to the galleys,\"\u00107 says Sancho.", "You ask each one the cause of his misfortune. One goes for being in love with a basket of white linen. Another for being a musician: he sang under torture (which is to confess). Another, an old man with a white beard, for being a go-between and something of a sorcerer. And the last, a very good-looking man loaded with chains, is the famous Ginés de Pasamonte, who has written his own life in a book.\n\u00106\"And is the book finished?\"\u00107 asks Sancho.\n\u00106\"How can it be finished, when my life is not finished yet?\"\u00107", "\u00104\"From all you have told me, dearest brethren, I gather clearly that you go very much against your will.\"\u00107 You charge the commissary so swiftly that, before he can defend himself, you bring him to the ground badly wounded by a lance thrust. The galley slaves break their chain and the guards run away.\nThen you gather them all together: \u00104\"It is my will that, laden with that chain, you at once set out and go to the city of El Toboso, and there present yourselves before the lady Dulcinea...\"\u00107\nThe answer is a hail of stones. They knock you off your horse, take a jacket from you and Sancho's coat from him, and each goes his own way. Sancho, fearing the Holy Brotherhood, suggests hiding in the Sierra Morena, to the south.", "That night, while you sleep, Ginés de Pasamonte steals Sancho's dapple. Or not. In the first edition the author forgot to tell it, and Sancho went on riding the dapple for a few more pages as if nothing had happened. The same happens here.", "You open the valise. Inside there are four shirts of fine holland, a handkerchief with a good heap of gold crowns, and the notebook, richly bound. Sancho swoops on the crowns like a hawk. \u00105\"Blessed be all heaven, that has sent us an adventure that is good for something!\"\u00107", "You imitate Amadis on the Peña Pobre. In great haste you pull off your breeches, stand in your skin and your shirt-tail, and then, without more ado, you cut two capers in the air and turn two somersaults, heels over head, revealing things that make Sancho turn his head so as not to see them again.", "You write in the notebook: \u00106\"Sovereign and exalted lady: The pierced by the point of absence, the wounded to the heart's core, sends thee, sweetest Dulcinea del Toboso, the health that he himself enjoys not... Thine till death, the Knight of the Rueful Countenance.\"\u00107\nUnderneath you add an order for Sancho's niece to give him three of the five ass colts you left at home.", "Sancho tucks the notebook into his bosom (or so he thinks), climbs onto Rocinante and sets off for El Toboso, scattering broom branches along the way so as to find his way back. You are left alone with your madness.\n(What neither of you knows is that the notebook has stayed with you.)", "You tear a long strip from the tail of your shirt and tie eleven knots in it, one bigger than the rest. It serves you as a rosary.", "You write a great many verses on the bark of the trees and in the fine sand, all suited to your sadness. The best of them says: \u00106\"Here Don Quixote wept / for Dulcinea del / Toboso's absence.\"\u00107 The del Toboso part you add just in case.", "After three days Sancho returns. And he does not come alone: with him are the curate and the barber of your village (with false beards made from an ox tail that fool nobody) and a most beautiful damsel. Sancho recites the letter from memory: \u00105\"Exalted and scrubbed lady...\"\u00107\nThe damsel kneels before you: \u00106\"From this spot I will not rise, O valiant and doughty knight, until your goodness and courtesy grant me a boon. I am the princess Micomicona, of the great kingdom of Micomicon, and the giant Pandafilando of the Scowl has usurped my kingdom.\"\u00107", "\u00104\"I grant and accord it, lady, and let no more be said.\"\u00107\nYou all set off together. And, as could only be expected, you end up once again at the inn of Juan Palomeque, who turns pale at the sight of you. The curate promises to pay for whatever damage you do. All of it.", "You fall asleep and dream that you are in the kingdom of Micomicon, before the giant Pandafilando of the Scowl. You get up in your shirt, which does not quite cover your thighs, with a greasy red nightcap on your head and your sword in your hand. The giant is right there in the dark, fat, hanging from the wall...", "You slash right and left. The giant bleeds! He bleeds... white. The wineskins the innkeeper keeps hanging in the garret burst one after another, and out of them pours a river of... skimmed milk?\n\u00106\"My wineskins! My red wine from Valdepeñas!\"\u00107 cries the innkeeper, who has been selling skimmed milk to the carriers as good wine for years. \u00106\"I mean... my milk! I mean... my ruin!\"\u00107\n\u00105\"He has already cut off the giant's head, I saw it myself, and the blood ran along the floor like a river!\"\u00107 shouts Sancho, searching the whole room for the head. The barber throws a bucket of cold water over you and you wake up. The curate pays for the wineskins. And the milk.", "That night, while you sleep, the curate, the barber and the people of the inn, their faces covered, tie you hand and foot and put you in a cage of wooden bars on an ox cart. A dreadful voice, which sounds very much like the barber's, announces:\n\u00106\"O Knight of the Rueful Countenance, let not the captivity in which thou art placed afflict thee, for this must needs be, for the more speedy accomplishment of the adventure in which thy great heart has engaged thee...\"\u00107\nYou accept it with great dignity: you are enchanted. Just as in the books.", "Sancho comes up to the cage: \u00105\"Sir, in case your worship doesn't know, those two masked men in front have the very same faces as the curate and the barber of our village. And tell me one thing: has your worship felt any need to do what no one can do for you, as the saying goes?\"\u00107\n\u00104\"Many times, Sancho.\"\u00107\n\u00105\"Then you are not enchanted, for enchanted people don't eat, or sleep, or do those things!\"\u00107\n\u00104\"There are many kinds of enchantment, Sancho.\"\u00107", "After six days you reach your village, on a Sunday at noon, with everyone in the square. The housekeeper and the niece, seeing you thin and sallow, stretched on a heap of hay in the cart, raise cries that reach the heavens and curse the books of chivalry all over again. Sancho's wife asks him whether he has brought her a petticoat; Sancho talks to her of islands.\nThey put you to bed. But the annals of La Mancha say that, the third time you left your house, you went to Saragossa...\n\u00106\u00131END OF PART ONE\u00130\u00107", "So much walking on foot ends your life and you die of exhaustion. A knight errant rides on horseback, and for good reason. \u00102You are very dead.\u00107", "\u00106\"I will not tolerate your worship's insults!!\"\u00107\nThe innkeeper pulls off a ring that has belonged to his family since Roman times. The ring turns into a magic sword. A keen flash cuts through the air. Seconds later, because of your insolence, your head rolls on the floor. \u00102You are dead.\u00107", "Out of the foliage of the wood comes a certain dwarf, a great friend of the farmer. He throws an axe at you and cuts off your head. \u00102You are dead.\u00107", "The ceiling falls in on your head and kills you. It is a punishment from God for insulting one of His creatures. \u00102You are dead.\u00107", "A flock of rams tramples you and you die for not watching your tongue. \u00102You are very dead.\u00107", "The barber, tired of waiting, shaves your neck dry and you bleed to death. What a silly end for so great a knight.", "A lean hack, white, with a few small black spots on his rump. He has more cracks in his hoofs than a real has quarters. To you it seems that neither Alexander's Bucephalus nor the Cid's Babieca can match him.", "Sancho Panza: big belly, short body and long shanks. An honest man, if that title can be given to one who is poor, but with very little salt in his skull.", "\u00106DON QUIXOTE OF LA MANCHA\u00107\n(c) AVENTURAS LEVEL 10\n\nOriginal version for the ZX Spectrum (1989): Jorge Louzao Penalva.\nThanks to all who helped: Angel Louzao Penalva and Luis Gabaldón Alvarez.\n\nRemake 2026. Text based on the work of Miguel de Cervantes, with liberties the author would not have approved of.", "\u00106\u00131        PART TWO\u00130\u00107\n\n\u00105  The ingenious knight\n Don Quixote of La Mancha\u00107", "Nearly a month goes by without the curate and the barber visiting you, so as not to bring past events back to your memory. At last they come. You talk with them of statecraft and modes of government with such good sense that they believe you entirely cured.\nUntil the curate, to test you, brings up the news that the Turk is coming down with a mighty fleet. \u00104\"What his majesty should do is order all the knights errant who roam about Spain to assemble at court on a fixed day, for even if no more than half a dozen came, there might be one among them able by himself to destroy the whole power of the Turk.\"\u00107\nThe barber sighs. The curate crosses himself. And they leave.", "Just then voices are heard in the entrance: the housekeeper and the niece won't let Sancho in, though he has come to see his master. Sancho comes in anyway.\n\u00105\"Last night Bartolomé Carrasco's son came back from his studies at Salamanca, a bachelor now, and he told me your worship's history is already in a book, called \u00106The Ingenious Gentleman Don Quixote of La Mancha\u00105. And that they mention me in it by my own name of Sancho Panza, and the lady Dulcinea del To
