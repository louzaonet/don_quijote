boso, and other things that happened to us when we were alone, so that I crossed myself in wonder at how the historian could know them.\"\u00107\nAnd off he runs to fetch the bachelor.", "The bachelor Samson Carrasco is not very big in body, but a very great wag, sallow of complexion, but of very good understanding. He goes down on his knees before you: \u00106\"Give me your hands, Señor Don Quixote of La Mancha.\"\u00107\nHe tells you that more than twelve thousand copies of your history are in print: in Portugal, in Barcelona, in Valencia, and even in Antwerp. That children turn its leaves, young people read it, grown men understand it and old folk praise it. And that some find fault with it: that the author forgot to tell who stole Sancho's dapple, and that later, without saying how, Sancho turns up riding the very same ass.\n\u00105\"That was Ginés de Pasamonte!\"\u00107 shouts Sancho. \u00106\"And they say there will be a second part,\"\u00107 adds the bachelor. \u00106\"My advice is that your worship should go to Saragossa, to the jousts in honour of Saint George.\"\u00107 As he leaves, without your seeing it, he winks at the curate.", "Sancho plants himself in front of you and scratches the back of his neck: \u00105\"Teresa says I should tie my finger well with your worship, for a bird in the hand is worth two in the bush. So I'd like your worship to fix me a known wage, of what you'll give me each month for as long as I serve you.\"\u00107", "\u00104\"Look, Sancho: I have read all or most of the histories of knights errant, and I do not remember ever reading that any knight errant fixed a known wage for his squire. If thou wilt not come with me on trust, God be with thee, for I shall not want for squires.\"\u00107\nSancho is taken aback, and more so when the bachelor, who is passing by, offers himself as your squire. His eyes cloud over: \u00105\"Here I am, sir, to serve you faithfully and loyally, as well as and better than any squire who ever served a knight errant in times past or present.\"\u00107 And he leaves a new pair of saddlebags on the floor for you.", "At nightfall, without anyone knowing but the bachelor, who rides half a league with you, you set off on the road to El Toboso. You on your good Rocinante and Sancho on his old dapple, the saddlebags well furnished with things to eat. Samson embraces you both, wishes you a good journey and goes back to the village. He smiles more than he should.\nRocinante neighs and the dapple brays, which you both take for a good omen.", "\u00104\"Sancho, my son, lead on to Dulcinea's palace, for perhaps we may find her awake.\"\u00107\n\u00105\"What palace am I to lead to, body of the sun, when the one I saw her highness in was nothing but a very little house?\"\u00107\nSancho has never seen Dulcinea in his life, and neither have you, though you often forget the latter.", "You head for the great mass casting its shadow and come upon a tall tower. \u00104\"It is the church we have come upon, Sancho.\"\u00107\n\u00105\"So I see, and God grant we don't come upon our graves, for it's no good sign to wander in churchyards at such hours.\"\u00107", "Along the lane comes a farmer with two mules, going out to plough very early, singing the ballad of \u00106\"Ill went it with you, Frenchmen, at Roncesvalles\"\u00107.", "\u00106\"Sir, I'm a stranger here and it's only a few days since I came to this town, to work the land for a rich farmer. There's no princess here at all. Plenty of fine ladies, yes, for each one can be a princess in her own house.\"\u00107\nAnd off he goes, urging on his mules, without waiting for more questions.", "\u00105\"Sir, the day is coming on, and it won't be wise to let the sun find us in the street. Better we go out of the city, and your worship hide in some wood near here, and I'll come back by day and leave no corner in this whole place where I don't look for my lady's house, alcazar or palace.\"\u00107\nSancho goes into the town. As he leaves, you hear him talking to himself: \u00105\"This master of mine, by a thousand signs I've seen, is a madman fit to be tied... And being so, it won't be very hard to make him believe that a country girl, the first I come across here, is the lady Dulcinea.\"\u00107", "After a good while Sancho comes running back: \u00105\"Good news, sir! There's nothing to be done but for your worship to spur Rocinante and come out into the open to see the lady Dulcinea del Toboso, who is coming to see your worship with two of her damsels.\"\u00107\nAlong the road come three country girls on three young asses. All you see is three country girls on three donkeys. Sancho sees three princesses on three piebald hackneys.", "You go down on your knees beside Sancho before one of them, who is round-faced, snub-nosed and rather chubby. \u00106\"Get out of the way, bad luck to you, and let us pass, for we are in a hurry!\"\u00107 says the country girl.\nShe prods her donkey, which throws her to the ground. Without waiting for anyone, she takes a little run, puts her hands on the donkey's haunches and lands, lighter than a hawk, on the pack saddle. And off the three of them go at full speed. A smell of raw garlic reaches you that turns your stomach and poisons your soul.\n\u00104\"Seest thou, Sancho, how the enchanters hate me? See how far their malice reaches: they have changed my Dulcinea into a country girl.\"\u00107 Sancho covers his mouth so as not to laugh.\n\u00106Dulcinea is enchanted. And the peasant girl is Dulcinea.\u00107", "Across the road comes a cart loaded with the most varied and strange figures. The one driving the mules is an ugly demon. The cart is open to the sky: the first figure is Death himself, with a human face; beside him, an angel with large painted wings; to one side, an emperor with a crown, apparently of gold, and at Death's feet the god Cupid, without his blindfold, but with his bow and quiver.", "\u00106\"Sir, we are players of the company of Angulo el Malo. This morning we performed the play \u00105The Parliament of Death\u00106, and we are to perform it this afternoon in that village you can see from here. And as it is so near, we came dressed in the very costumes we act in.\"\u00107\n\u00104\"Go with God, good people, and hold your festival.\"\u00107\nJust then one of the company comes up dressed as a jester, with a lot of bells and three blown-up cow bladders on the end of a stick. He shakes the bladders next to Rocinante, who takes fright and throws you to the ground. The demon from the cart jumps on the dapple and gallops off towards the village. A little later the dapple throws him and comes back by himself to his master.", "The people of the cart, seeing you coming, jump down and line up, with stones in their hands: Death, the emperor, the demon driver, the angel, the queen and the god Cupid.\n\u00105\"Look, sir, among all those people there, though they look like kings, princes and emperors, there isn't a single knight errant. And your worship mustn't lay hand to sword against anyone who hasn't been dubbed a knight.\"\u00107", "You charge again. The players are not knights, but they aim as if they were. A shower of pebbles leaves you lying under the cart, and Death, very much in character, closes your eyes. \u00102You are dead, and this time it isn't theatre.\u00107", "At the foot of a tree another knight is singing a sonnet to his lady to the sound of a lute: \u00106\"Grant me, lady, a fixed term to follow...\"\u00107 He wears a surcoat that seems to be of the finest gold, sown with many little moons of shining mirrors. There is another knight here beside his mount.", "\u00106\"I am the Knight of the Mirrors.\"\u00107\n\u00106\"Tell me, your worship: is not Casildea de Vandalia the most beautiful maiden? Answer me.\"\u00107", "\u00106\"What, no? Prepare yourself for combat!!\"\u00107\nDown come the visors. Your squire and the squire of the Mirrors, who has a frightful nose, withdraw to a prudent distance.", "\u00106\"I knew well you would not fight, your worship is a coward.\"\u00107\nYou repent of your cowardice and decide to leave the order of chivalry. You go back home and stay there weeping over your decision.", "You strike the knight in the chest with your lance and unhorse him.\n\u00106\"I yield. I know your glorious deeds: the most beautiful is without doubt Dulcinea del Toboso.\"\u00107\nYou take off his helmet to see whether he is alive and you find... the very face, the very figure, the very look, the very features, the very likeness of the bachelor Samson Carrasco. His squire takes off his nose, which was made of pasteboard, and turns out to be Tomé Cecial, Sancho's neighbour and crony.\n\u00104\"Enchanters! They have taken on the bachelor's form to rob me of the glory of my victory.\"\u00107 Sancho doesn't know what to think. You do.", "You try to escape and the Knight of the Mirrors runs you through the back with his lance. \u00102You are dead.\u00107", "The Knight of the Mirrors defeats you. You go back to your village and leave the order of chivalry.", "Along the road comes a cart crowned with royal flags. Sancho, who had bought some curds from some shepherds, doesn't know where to put them when you call him in a hurry, and puts them in your helmet, which you had taken off for a moment because of the heat.", "You clap the helmet on and the whey begins to run all over your face and beard. \u00104\"What can this be, Sancho, for it seems as if my skull were softening, or my brains melting, or that I am sweating from head to foot?\"\u00107", "The carter, who is the lion keeper, explains: \u00106\"In the cart there are two fierce lions in cages, which the general of Oran is sending to court as a present for his majesty. Hungry, for they haven't eaten today.\"\u00107\n\u00104\"Lion whelps to me? To me lion whelps, and at such a time? Then, by God, those gentlemen who send them here shall see if I am a man to be frightened by lions. Open those cages.\"\u00107", "The lion keeper, trembling, flings the first cage wide open. Don Diego de Miranda spurs his mare, Sancho his dapple and the carter his mules, and they take refuge far away.\nThe lion turns round in the cage, stretches out a paw, stretches himself, opens his mouth and yawns very slowly. Then he puts his head out and looks all around with eyes like live coals. There is a lion here with a hungry look on his face.", "\u00102\"La donna è mobile qual piuma al vento...\"\u00107\nThe lion begins to fall asleep and goes off to look for a more comfortable place to have a nap. You can see a jewel on the ground.", "The lion keeper shuts the cage. They all come back and you give the keeper two gold crowns to tell his majesty what he has seen. \u00104\"If his majesty should ask who performed it, thou shalt say the Knight of the Lions, for from this time forward I mean that this name shall replace, change, transform and alter the one I have borne until now, of the Knight of the Rueful Countenance.\"\u00107", "The lion eats you and puts an end to your glorious career as a knight.", "You attack the lion, but his strength is greater than yours and he kills you. \u00102You are dead and devoured.\u00107", "A gold jewel with a stone that shines like a piece of the sun. You keep it: it is worthy of Dulcinea. Of the old one, the one who didn't smell of garlic.", "Sancho stares at the pots like a child at a shop window. From the elms hang hares already skinned and hens already plucked. There are more than fifty cooks, all clean, all busy and all cheerful.", "Sancho goes up to one of the cooks and begs him, in courteous and hungry terms, to let him dip a crust of bread in one of those pots. \u00106\"Brother, this is not one of those days over which hunger has any jurisdiction. Skim off a hen or two, and much good may they do you.\"\u00107\nThe cook takes a ladle, plunges it into one of the jars and brings out three hens and two geese. Sancho sits down to eat with more appetite than in the whole of Part One.", "The bride and groom arrive. Quiteria is radiant, with her corals and her velvet. Camacho, rich and pleased. Then in comes a man dressed in black, with a wreath of mournful cypress and a great staff in his hands: it is Basilio, the poor shepherd who has loved Quiteria since they were children.\n\u00106\"Thou knowest well, ungrateful Quiteria, that thou didst promise to be my wife. Well, my death will clear the way to thy happiness.\"\u00107 He drives the staff into the ground; hidden inside it was a short sword, and he throws himself upon it. He falls bathed in blood.\nWith what voice he has left, he asks that Quiteria give him her hand as his wife before he dies. Camacho doesn't know what to say.", "\u00104\"It is just and reasonable, Señor Camacho, what this youth asks. And your worship will be as much honoured in receiving Quiteria as the widow of so valiant a husband as if you received her from her father's side.\"\u00107\nCamacho, thinking the wounded man will die before you can say two credos, consents. The priest marries them. And no sooner has Quiteria said yes than Basilio springs to his feet and pulls the sword out of his body, which went into an iron tube full of prepared blood. \u00106\"No miracle, miracle, but trick, trick!\"\u00107\nCamacho's friends lay hand to their swords.", "You place yourself between them, on horseback, with your lance on your arm: \u00104\"Hold, sirs, hold, for it is not right to take vengeance for the wrongs that love does to us. Quiteria was Basilio's, and Basilio Quiteria's, by the just and favourable disposition of heaven. And those whom God has joined, let no man put asunder.\"\u00107\nCamacho, seeing that Quiteria doesn't love him, decides his pots are worth more to him. The wedding goes on as if nothing had happened. Basilio thanks you with a cousin of his, a famous student and great humanist, who offers to guide you to the cave of Montesinos. And he gives you a rope of a hundred fathoms, for going down a cave you need one badly.", "\u00106\"This is the cave of Montesinos,\"\u00107 says the cousin, who is writing a book of the Spanish Ovid and another of the inventors of things. \u00106\"They tell great marvels about it. And it's very deep.\"\u00107", "You draw your sword and begin to cut down and hack away the brambles. At the noise, out of the mouth of the cave fly countless enormous crows and jackdaws, so thick and in such haste that they knock you to the ground. Were you as superstitious as you are Catholic, you would take it for an evil omen.", "Sancho and the cousin tie the rope round your waist, good and tight. \u00105\"God guide you, and the Rock of France, together with the Trinity of Gaeta, flower, cream and skimmings of knights errant!\"\u00107", "You commend yourself to Dulcinea and let yourself down into the depths of the dreadful cavern. Sancho and the cousin pay out the rope, and you call out for more and more. In the end you stop calling.", "You lie down in the hollow, tired of so much darkness, and a very deep sleep comes over you. When you wake, without knowing how or why, you find yourself in the middle of the most beautiful, pleasant and delightful meadow that nature could create.", "\u00106\"Long ages have we who are enchanted in these solitudes been waiting to see thee, valiant knight Don Quixote of La Mancha.\"\u00107\nMontesinos leads you before a marble tomb on which lies the knight Durandarte, flower and mirror of lovelorn knights. Above, in a line, passes a procession of damsels, and behind them the lady Belerma, with dark rings under her eyes and Durandarte's heart in her hands, in a cloth of holland, which he himself cut out with a dagger. And we salted it, so that it would reach her smelling sweet.\n\u00106\"Patience, and shuffle the cards,\"\u00107 sighs Durandarte from the tomb, quite rightly.", "Across the meadow, leaping and skipping like goats, come three country girls. One of them is the peerless Dulcinea del Toboso, enchanted, the same one you saw outside El Toboso. You call to her and she turns her back on you.\nOne of her companions comes up: \u00106\"My lady Dulcinea kisses your worship's hands and begs you to let her know how you are. And, being in great need, she begs your worship to lend her half a dozen reals on this new cotton petticoat I have here.\"\u00107", "\u00104\"Tell your lady, my friend, that her troubles grieve me to the soul, and that I would I were a Fugger to remedy them. And that I have no more than four reals.\"\u00107\nYou give them to her. Instead of making you a curtsey, she cuts a caper that lifts her two yards into the air. The petticoat she leaves with you.", "Up above they pull on the rope. They bring you out of the cave with your eyes closed, as if asleep. \u00104\"God forgive you, friends, for you have taken me away from the sweetest and most delightful existence and spectacle that ever human being enjoyed or beheld.\"\u00107\nYou tell them you have been down there three days. Sancho swears it was little more than an hour. And when you tell them about the four reals, Sancho slaps his forehead, because it was he who enchanted Dulcinea, and now it turns out the enchanters are competing with him.", "\u00106\"This ape talks, but his master understands him: he divines the past and the present, though of the future he knows nothing.\"\u00107 The moment the ape sees you, he jumps onto Master Pedro's shoulder and whispers something in his ear.\n\u00106\"O glorious reviver of knight-errantry, now so forgotten! O never duly praised knight Don Quixote of La Mancha!\"\u00107 cries Master Pedro, falling on his knees.", "You ask the ape whether what you saw in the cave of Montesinos was real or a dream. The ape jumps, chatters and talks into his master's ear.\n\u00106\"The ape says that some of the things your worship saw or went through in that cave are false, and some likely. And that he knows no more, because his powers have run out.\"\u00107", "You sit in the front row. A boy announces the show: \u00106\"This true story here presented to your worships tells how Señor Don Gaiferos set free his wife Melisendra, who was a captive in Spain, in the hands of the Moors, in the city of Sansueña.\"\u00107\nMelisendra lets herself down from the tower onto the crupper of Gaiferos' horse, and off the two of them go on the road to Paris. But King Marsilio has the alarm sounded, and with such a din of bells and kettledrums that the city seems to be falling down, all the Moorish host rides out in pursuit. \u00104The Moors are about to catch them.\u00107", "\u00104\"Never, while I live, will I permit foul play to be practised in my presence on so famous a knight and so daring a lover as Don Gaiferos! Halt, ill-born rabble!\"\u00107\nYou draw your sword and with one bound you are beside the show. With swift and unheard-of fury you begin to rain slashes on the puppet Moors: you knock some down, behead others, maim this one, demolish that one. And among many others you deal such a downstroke that, had Master Pedro not ducked, you would have cut off his head.\n\u00106\"Stop, your worship, Señor Don Quixote, and mind that those you are knocking down are not real Moors, but little figures made of paste!\"\u00107", "\u00104\"Now I truly believe that these enchanters who persecute me put figures before my eyes as they really are, and then change them into whatever they please.\"\u00107\nMaster Pedro values the damage, figure by figure: King Marsilio, beheaded, four and a half reals; Charlemagne, with his crown split, five reals and a quarter... Sancho pays forty reals and three-quarters in all, and two reals more for the trouble of catching the ape, which has fled to the roof. Before dawn, Master Pedro disappears. (He was Ginés de Pasamonte, who covered his eye with a patch so you wouldn't recognise him.)", "\u00104\"Thou must know, Sancho, that this boat here, plainly and beyond all possibility of doubt, is calling and inviting me to embark in it and go in it to give aid to some knight or other person of rank in distress, who must be in some great trouble.\"\u00107", "\u00104\"Seest thou? There, O friend, stands revealed the city, castle or fortress where some oppressed knight or some queen, infanta or princess in distress must be.\"\u00107 \u00105\"What the devil city, fortress or castle does your worship mean? Can't you see that those are watermills in the river, where they grind the wheat?\"\u00107\nThe millers, covered in flour, come out with long poles: \u00106\"Devils of men! Where are you going? Have you gone mad? Do you want to drown and be smashed to pieces in these wheels?\"\u00107\nYou stand up in the boat and threaten the millers with your sword. The current carries the boat into the race of the wheels; the millers manage to stop it with their poles, but not without tipping you and Sancho into the water. They fish you out like two wet cats. The boat is smashed to pieces.\nThe fishermen who own the boat arrive, and Sancho pays them fifty reals very much against his will. \u00104\"God help us, for this whole world is nothing but schemes and contrivances, each against the other. I can do no more.\"\u00107", "Sancho gets off the dapple, kneels before the huntress and says: \u00105\"Fair lady, that knight you see over there, called the Knight of the Lions, is my master, and I am a squire of his, whom they call at home Sancho Panza.\"\u00107\nThe lady turns out to be a duchess, and what's more, she has read Part One of your history. \u00106\"Let him come, and welcome, to make use of us, for we have a castle near here.\"\u00107\nAs you dismount, with nobody to hold your stirrup, your foot gets caught and you come down full length on the ground. The dukes hide their laughter as best they can.", "Before you go in, two lackeys throw over your shoulders a great mantle of the finest scarlet, and damsels and duennas sprinkle you with flasks of scented water. \u00106\"Welcome to the flower and cream of knights errant!\"\u00107 Some grooms take Rocinante to the stables, where they treat him better than ever in his life.", "The ecclesiastic, who has heard of your follies, rises from the table: \u00106\"And you, numskull, who has stuck it into your brain that you are a knight errant, that you vanquish giants and capture malefactors? Go your way, and go home, and bring up your children if you have any, and look after your property, and stop wandering about the world.\"\u00107", "You rise, trembling from head to foot like a man full of quicksilver: \u00104\"Some go by the broad road of proud ambition; others by that of mean and servile flattery; others by that of deceitful hypocrisy, and some by that of true religion. But I, led by my star, follow the narrow path of knight-errantry. A knight I am, and a knight I will die, if it be the will of the Most High.\"\u00107\n\u00105\"Well said, by God! Say no more, your worship, sir and master mine,\"\u00107 says Sancho. The ecclesiastic gets up and leaves, saying the master is as mad as the squire.", "A doleful fife sounds. Into the garden comes a man with a long white beard, Trifaldin of the White Beard, who announces the Countess Trifaldi, otherwise called the Distressed Duenna. Behind him come twelve duennas in mourning, and the countess, with a train in three points.\nThe duennas raise their veils: they all have beards, some fair, some black, some white and some grizzled. \u00106\"The giant Malambruno has enchanted us, and no one can disenchant us but the valiant Don Quixote, who must go and fight him in the kingdom of Candaya, three thousand leagues from here, give or take a few. Will the knight come?\"\u00107", "\u00104\"I will do, lady, all that I can, with the help of God.\"\u00107\nIn come four wild men dressed in ivy carrying a great wooden horse on their shoulders. \u00106\"This is Clavileño the Swift, who is steered by a peg in his forehead. Knight and squire must mount, one in the saddle and the other on the crupper. And both must go with their eyes blindfolded, for otherwise they will grow giddy with the height.\"\u00107", "You mount Clavileño. Sancho climbs onto the crupper, complaining that it is not made of velvet, and blindfolds himself with a duenna's handkerchief. \u00105\"Sirs, commend us to God, for we're off to this Candaya.\"\u00107", "You turn the peg. The duennas and everyone present raise their voices: \u00106\"God guide thee, valiant knight! Now, now you are going through the air, cleaving it swifter than an arrow!\"\u00107\nWith some great bellows they blow wind at you. \u00104\"Without a doubt, Sancho, we must be reaching the second region of the air, where the hail and the snow are formed.\"\u00107 Then they warm your faces with lighted tow on the end of a cane. \u00105\"Kill me if we aren't in the region of fire already, for a good part of my beard has been singed!\"\u00107\nAt last, as Clavileño's belly is full of crackers, they set fire to him and he flies through the air with a strange noise, and drops you both on the ground, half singed. The duennas have vanished. In the garden there is a lance stuck in the ground with a parchment: \u00106\"The illustrious knight Don Quixote of La Mancha ended and achieved the adventure of the Countess Trifaldi, otherwise called the Distressed Duenna, by merely attempting it.\"\u00107", "The duke, delighted, keeps the promise he made: Sancho shall be governor of an island. Before he leaves, you shut yourself in with him and give him advice: \u00104\"First of all, my son, thou must fear God, for in the fear of Him is wisdom. Thou must keep in view what thou art, striving to know thyself. Take pride in the humbleness of thy lineage. Let the tears of the poor man find more compassion, but not more justice, than the pleadings of the rich. Eat not garlic nor onions, lest they find out thy boorish origin by the smell.\"\u00107\n\u00105\"If your worship thinks I'm not fit for this government, I give it up here and now, for I'd sooner go to heaven as Sancho than to hell as a governor.\"\u00107\n\u00104\"For those last words thou hast spoken, I judge thou deservest to be governor of a thousand islands.\"\u00107", "\u00105And from here the history leaves Don Quixote at the castle and follows Sancho. Now you are Sancho Panza, governor.\u00107", "You are received with the ringing of bells and every sign of general rejoicing. They lead you with great pomp to the great church to give thanks to God, and then they hand you the keys of the town and accept you as perpetual governor of the island of Barataria. Nobody quite knows what you are smiling about.", "Two old men come in. One carries a cane for a staff. The other, who has none, speaks: \u00106\"Sir, some days ago I lent this good man ten gold crowns, and I've asked him for them many times, and not only does he not give them back, but he denies it, and says I never lent him any ten crowns, and that if I did, he has already returned them.\"\u00107\nThe one with the staff, in order to swear that he returned them, gives the staff to the other to hold while he swears, as if it were in his way. He swears on the cross of the wand. Then the lender gives him back his staff, convinced. The old man with the staff bows and gets ready to leave.", "\u00105\"Give me that staff, good man, for I have need of it.\"\u00107 The old man gives it to you, with a face you can't read.", "You break the cane in half. Out of it fall ten crowns in gold. Everyone is amazed and takes their governor for a new Solomon. \u00105\"He who swears he has returned what he holds in his hand swears a great deal and returns very little.\"\u00107\nThe lender goes off with his money. The one who swore, with his shame. The chronicler writes it all down.", "As soon as you reach out for a dish, the man with the wand touches it, and a page whisks it away as swiftly as if it were enchantment. \u00106\"That fruit is too moist, and that other dish is too hot and has too many spices. And the partridges... \u00102omnis saturatio mala, perdices autem pessima\u00106.\"\u00107", "\u00105\"Well then, Señor Doctor Pedro Recio of Bad Omen, native of Tirteafuera, a place on the right-hand side as we go from Caracuel to Almodóvar del Campo, get out of my sight at once. If not, I swear by the sun I'll take a cudgel and, cudgelling away, beginning with him, I'll not leave a doctor in the whole island.\"\u00107\nThe doctor slinks out of the room with his wand between his legs.", "They serve you a hash of beef with plenty of onion and some boiled calves' feet, somewhat past their best. You eat with more relish than if they had given you francolins of Milan, pheasants of Rome or geese of Lavajos. When you have finished, a letter arrives from the duke: \u00106\"Certain enemies of mine and yours mean to make a furious assault on that island, I know not on what night. It is advisable to keep watch and be on the alert.\"\u00107", "In one street you come upon two men quarrelling over a gaming house. You send one home and the other out of the island, with the chronicler writing it all down. Further on, the constables bring in a girl dressed as a man, as lovely as a thousand pearls, who won't say who she is.", "The girl, weeping, confesses: \u00106\"I am the daughter of Pedro Pérez Mazorca, who farms the wool tax of this town. My father has kept me shut up for ten years, and I only wanted to see the world, or at least the town where I was born.\"\u00107\n\u00105\"This is a piece of childishness, and to tell such nonsense there was no need for so much beating about the bush.\"\u00107 You send her home to her father, with her brother, who is also wandering about disguised as a woman. The chronicler can't keep up.", "At midnight you are woken by the bells and by voices: \u00106\"To arms, to arms, señor governor, to arms! Countless enemies have entered the island, and we are lost unless your skill and valour come to our aid!\"\u00107\nThey fit you with two big shields, one in front and one behind, tied with cords, so that you are boarded up and planked in, as straight as a spindle, unable to bend your knees or move a single step. \u00106\"Come on, señor governor, lead us and encourage us all!\"\u00107 You take one step and fall to the ground like a tortoise. All night long they run over you, slashing at the shields, until they shout: \u00106\"Victory, victory! The enemy is in retreat!\"\u00107\nThey untie you. You are battered, and very thoughtful.", "You dress in silence, go to the stable and embrace the dapple, and give him a kiss of peace on the forehead. Then you saddle him, mount, and turn to all those watching you:\n\u00105\"Make way, gentlemen, and let me go back to my old freedom. I was not born to be a governor, or to defend islands or cities from the enemies who want to attack them. Ploughing and digging I understand better than giving laws. Naked I was born, naked I find myself: I neither lose nor gain.\"\u00107\nYour government has lasted ten days. They offer you company, and you don't want it: you ask only for a little barley for the dapple and half a cheese and half a loaf for yourself.", "On the way to the castle night falls upon you and the dapple, and among some ruins the two of you fall into a very deep pit. You break nothing, which you take for a miracle, but down there nobody can hear you.", "\u00105And here the history leaves Sancho in his pit and goes back to Don Quixote, who is you once more.\u00107\nOne morning you ride out of the castle to practise what you would have to do in the event of a combat, and Rocinante very nearly puts his feet into a pit.", "Great cries come out of the pit: \u00105\"Hallo up there! Is there any Christian who hears me, or any charitable knight who will take pity on a sinner buried alive, on a wretched ungoverned governor?\"\u00107", "You let the rope down into the pit. Sancho ties the dapple, then himself, and with the help of some of the duke's servants who come at your shouts you bring the two of them out into the light of day. Sancho, on his knees, gives thanks to God. The dapple brays.", "You enter Barcelona on Midsummer Eve, at night, and in the morning you see the sea for the first time. Don Antonio Moreno, a rich and discreet gentleman, a friend of the bandit Roque Guinart, lodges you in his house and walks you through the city with a placard on your back that says: \u00106This is Don Quixote of La Mancha.\u00107 You believe they recognise you by your fame.\nIn one room of his house there is a head, apparently of bronze, on a jasper table. Don Antonio says it answers whatever it is asked.", "You go up to the head and ask it in its ear: \u00104\"Was it truth or was it a dream, what I say happened to me in the cave of Montesinos? Will Sancho's lashes come true? Will Dulcinea's disenchantment take effect?\"\u00107\n\u00106\"As for the cave, there is much to be said: it has something of everything. Sancho's lashes will go slowly. Dulcinea's disenchantment will be duly accomplished.\"\u00107\nSancho asks whether he will have another government. \u00106\"Thou shalt govern in thy house, and if thou return to it, thou shalt see thy wife and children.\"\u00107 \u00105\"I could have told you that myself!\"\u00107 (Inside the table there is a student, Don Antonio's nephew, who speaks through a tin tube. Don't tell Sancho.)", "Along the beach a knight comes towards you, armed from head to foot, with a shining moon painted on his shield.\n\u00106\"Illustrious knight and never sufficiently extolled Don Quixote of La Mancha: I am the Knight of the White Moon. I come to do battle with thee and prove the might of thy arm, to the end that I make thee acknowledge and confess that my lady, whoever she may be, is incomparably fairer than thy Dulcinea del Toboso. If thou fightest and I vanquish thee, thou shalt lay down thine arms and retire to thy village for the space of a year. And if thou vanquish me, my head shall be at thy disposal, and the spoils of my arms and horse shall be thine.\"\u00107", "\u00104\"Knight of the White Moon, whose achievements have never yet come to my knowledge: I will make thee swear that thou hast never seen the illustrious Dulcinea. I accept thy challenge, and at once, so that the day thou hast fixed may not pass.\"\u00107", "You both wheel your horses at the same moment. The Knight of the White Moon, being swifter, meets you two-thirds of the way along the course, and there he encounters you with such mighty force, without touching you with his lance (for he raises it, it seems, on purpose), that he brings Rocinante and you to the ground in a perilous fall.\nHe sets his lance against your visor: \u00106\"Vanquished you are, knight, and dead too, if you do not confess the conditions of our challenge.\"\u00107\nBruised and stunned, without raising your visor, as if speaking from inside a tomb, in a weak and feeble voice: \u00104\"Dulcinea del Toboso is the fairest woman in the world, and I the most unfortunate knight on earth; it is not fitting that this truth should suffer by my feebleness. Drive thy lance home, sir knight, and take my life, since thou hast taken away my honour.\"\u00107\n\u00106\"That will I not, in sooth. Live the fame of the lady Dulcinea del Toboso's beauty undimmed as ever. I am satisfied that the great Don Quixote should retire to his own home for a year.\"\u00107 And you promise it, as a punctilious and true knight.", "Don Antonio follows the victor to his inn and finds out: the Knight of the White Moon is the bachelor Samson Carrasco, who, defeated in the wood as the Knight of the Mirrors, swore to come back to send you home and see whether that might cure you.\nYou leave Barcelona. As you pass the spot where you were overthrown, you turn to look at it: \u00104\"Here Troy was. Here my ill fortune, not my cowardice, robbed me of all the glory I had won. Here my star fell never to rise again.\"\u00107 Your armour rides on the dapple, hung from a tree like a trophy that moves.", "All the characters you have met lead you before Dulcinea...\nThe curate and the barber, Samson Carrasco with his mirrors and his moon, the innkeeper castellan, Maritornes, the Biscayan, the lion keeper, Basilio and Quiteria, Montesinos, Master Pedro with his ape, the Distressed Duenna without her beard, the dukes, and Doctor Recio, who won't let anyone eat. Even Rocinante seems to know where he is going.", "\u00103You got it right!! Dulcinea is the peasant girl who is bewitched.\u00107\nThe jewel has broken the spell and the two of you live happily for ever and ever. And as Don Quixote you will be remembered for ever.\n\u00105(That is how the Aventuras Level 10 adventure ended in 1989. Cervantes would not have approved, but then again nobody would have finished it.)\u00107", "You give the jewel to the one who looks like a princess. You have got it wrong: Dulcinea is the other one, for she is bewitched. The two of them go away and you have not managed to finish this adventure.", "On the threshing floors of the village, two boys are quarrelling: \u00106\"Don't tire yourself, Periquillo, you'll never see it in all the days of your life.\"\u00107 And a hare, fleeing from some greyhounds, comes to take shelter under the dapple's feet.\n\u00104\"Malum signum! Malum signum! Hare flies, greyhounds chase: Dulcinea appears not!\"\u00107\nSancho picks up the hare, gives it to the boys in exchange for a cage of crickets they have, and puts it in your hands: \u00105\"This hare is Dulcinea, and I've caught her. What bad omen is that?\"\u00107", "They put you to bed. A fever comes on you that keeps you in bed for six days, during which you are visited many times by the curate, the bachelor and the barber, your friends, while Sancho Panza, your good squire, never leaves your bedside. They try to cheer you up: the bachelor has written an eclogue and wants you all to become shepherds, Sancho as Pancino and you as the shepherd Quixotiz.\nThe doctor takes your pulse and says that, to be on the safe side, you should attend to the health of your soul, for that of your body is in danger.", "You sleep at a stretch, as they say, for more than six hours. When you wake you give a loud cry:\n\u00104\"Blessed be Almighty God, who has shown me such goodness! My reason is now free and clear, rid of the dark shadows of ignorance that my unhappy constant study of those detestable books of chivalry cast over it. Now I see through their absurdities and deceptions. Congratulate me, good sirs, that I am no longer Don Quixote of La Mancha, but Alonso Quijano, whose way of life won for him the name of Good.\"\u00107\nThey send for a notary. You want to make your will.", "\u00105\"Ah! Don't die, master, but take my advice and live many years, for the greatest madness a man can commit in this life is to let himself die without more ado. Don't be lazy, but get up from that bed, and let us go out into the fields dressed as shepherds, as we agreed: perhaps behind some bush we'll find the lady Dulcinea disenchanted, as fine as fine can be.\"\u00107", "\u00104\"Item, it is my will that, touching certain moneys in the hands of Sancho Panza, whom in my madness I made my squire, no account be demanded of him. And if, as when I was mad I had a share in giving him the government of the island, I could now, being in my senses, give him that of a kingdom, it should be his.\nItem, I leave all my estate to Antonia Quijana, my niece. And if she should wish to marry, let her marry a man of whom it has first been ascertained that he does not know what books of chivalry are.\"\u00107", "Amid the tears and lamentations of those present, you give up the ghost; that is to say, you die. The notary testifies that he has never read in any book of chivalry of any knight errant having died in his bed so calmly and so like a Christian as Don Quixote.\nThe bachelor places this epitaph upon your tomb:\n\u00106He held the world as nothing;\nits scarecrow and its bogey,\nand so it was that, in the end,\nhis fortune proved it best\nto live a madman, die a sage.\u00107\nAnd the pen of Cide Hamete Benengeli, hung up by a brass wire on a rack, says: \u00105\"For me alone was Don Quixote born, and I for him; it was his to act, mine to write.\"\u00107\n\u00106\u00131THE END\u00130\u00107", "Without the armour of the shields or of common sense, you stay in the street waiting for the enemy. The enemy, being make-believe, never comes. What comes is the cold of dawn, and then shame. You leave the island that same night, and the history, not knowing what to do with you, ends here.", "\u00106DON QUIXOTE OF LA MANCHA\u00107\nPart Two\n(c) AVENTURAS LEVEL 10\n\nPart Two keeps the puzzles of 1989: the Knight of the Mirrors, the lion who falls asleep to a song and the two girls who both say they are Dulcinea.", "You talk to yourself. As governor, you can afford to.", "It's you: big belly, short body, long shanks. And now, governor.", "Four silver reals. It isn't much, but it's everything.", "A rope of a hundred fathoms, a present from Basilio. As long as a sermon.", "A gold jewel with a stone that shines like a piece of the sun. Worthy of Dulcinea.", "A holland handkerchief, fine and large. It would do to blindfold someone.", "A thick cane, heavier than it looks.", "The helmet of Mambrino. It is of gold (or of brass), half the headpiece is missing and it has a notch for the beard. Sancho says it is a barber's basin.", "You blindfold yourself with the handkerchief. You can't see a thing, which is the whole point.", "You are already blindfolded.", "With what? You would need a handkerchief.", "Under the mattress, where you hid them from the housekeeper, you find four reals. For a rainy day.", "Under the mattress, where you hid them from the housekeeper, you find four reals. For a rainy day.", "Your bed. You know it well: a month in it.", "Beside the bed, hanging from a nail, are your arms. The housekeeper hasn't dared throw them away: she is afraid of them.", "You've slept quite enough: a whole month.", "Whom? Here are the bachelor SAMSON and SANCHO.", "A bachelor of Salamanca, about twenty-four, round-faced, flat-nosed and wide-mouthed: all signs of a mischievous disposition and a fondness for jokes and pranks.", "A bachelor of Salamanca, about twenty-four, round-faced, flat-nosed and wide-mouthed: all signs of a mischievous disposition and a fondness for jokes and pranks.", "You are not leaving without a squire. Sancho is in the hall, with something to ask you.", "Put on the corselet. A knight doesn't ride out in his doublet, not even at night.", "Put on the helmet of Mambrino. A knight doesn't ride out bareheaded.", "And the lance? It's in the hall, on its rack.", "You are missing the buckler.", "You are missing the sword.", "On foot? Mount Rocinante, who has put on weight and is raring to go.", "There is no turning back. At least not until you are defeated.", "The farmer has already gone. You can hear his ballad in the distance.", "A farm lad with two mules and a plough. He sings very badly and very loudly.", "A tall tower and a closed door. No palace at all.", "Whom are you waiting for? Dulcinea won't come by herself.", "You kneel. Nobody knows why. Neither do you.", "A knight doesn't speak to his lady like that, standing up. First he goes down on his knees.", "A knight doesn't speak to his lady like that, standing up. First he goes down on his knees.", "A round-faced, snub-nosed country girl on a young ass. Sancho swears she is Dulcinea. She smells of raw garlic.", "Your own lady! Not even enchanted.", "Sancho told you to wait for him here, in the oak grove.", "You can't leave without paying your respects to your lady.", "You won't leave El Toboso without seeing Dulcinea.", "Death, an angel, an emperor, Cupid and a demon for a driver. All very well dressed for real people.", "Death, with a human face. He looks at you without much interest.", "A truly ugly demon, horns and all. He drives the mules.", "Ask who they are first. A knight doesn't charge blindly. Well, he does, but not today.", "The players climb onto the cart. They have a show this afternoon.", "The cart blocks your way. And those characters are crying out for an explanation.", "With what? Take the lance, the Knight of the Mirrors won't wait.", "A knight doesn't attack another without first knowing who he is. Greet him.", "He hasn't challenged you yet. Answer his question.", "You can't leave without knowing who that sighing knight is.", "A surcoat sown with mirror moons and a helmet with green, yellow and white plumes.", "I don't think this is the right moment.", "To fight a lion, you first have to get him out of his cage.", "You turn your back on the lion. Bad idea.", "Rocinante won't let you: he has a lion in front of him and more sense than you.", "The lion looks at you. You look at the lion. The lion licks his lips.", "In the cage, a lion of extraordinary size, of fearful and hideous aspect.", "A huge lion, out of his cage, with a hungry look on his face.", "The lions' cart blocks your way, and you are not a man to pass by a pair of lions.", "Sancho has already eaten for both of you. For three, in fact.", "Six pots as big as wine jars, each able to hold a whole butcher's shop of meat. Sancho looks at them lovingly.", "The cooks have no time for chatter. The wedding is to the north, under the bower.", "A dying man? A bridegroom? Better say something to CAMACHO.", "Basilio and Quiteria have eyes only for each other. Camacho, only for his pots.", "A poor shepherd, nimble and discreet. For a dead man, he has a good colour.", "Radiant, with her corals and her thirty-pile velvet. Sancho says it isn't thirty, it's forty.", "Camacho the rich. Rich, and not much more.", "The wedding isn't over and, besides, you don't know where to go.", "Brambles aren't cut by hand. A sword would come in handy.", "Brambles aren't cut by hand. A sword would come in handy.", "Boxthorn, wild fig, brambles and briars. They need CUTTING.", "You already have the rope tied round your waist.", "You have no rope.", "First you'll have to clear a way through the brambles.", "On horseback, down a cave? Dismount.", "You've seen enough down there. More than anybody will believe.", "The mouth is blinded by brambles and briars.", "Without a rope? Not even Montesinos goes down like that.", "You don't enter a cave like this one: you go DOWN.", "Nobody sleeps well hanging from a rope. Look for some hollow to lie down in.", "There's no room to lie down here. Look for some hollow.", "There's no room to lie down here. Look for some hollow.", "\"Dulcinea!\" you shout. \"...ea, ...ea,\" answers the cave.", "\"Dulcinea!\" you shout. \"...ea, ...ea,\" answers the cave.", "\"Patience, and shuffle the cards,\" answers Durandarte from his tomb. It's all he ever says.", "\"Half a dozen reals, sir, on this petticoat,\" insists Dulcinea's companion.", "Montesinos sighs: \"Patience, and shuffle the cards, as my cousin Durandarte says.\"", "To whom?", "You already gave her all you had.", "The reals are in the saddlebags. Take them out first.", "You have nothing to give. (Didn't you keep something for a rainy day, at home?)", "Durandarte lies on his marble tomb, his right hand on the side of his heart, which he no longer has.", "A venerable old man, in a hooded cloak of purple baize, with a white beard that reaches below his waist.", "It is the same country girl from El Toboso. Dulcinea, enchanted, skipping across the meadow.", "Montesinos looks at you as if waiting for you to speak to him. It would be discourteous to leave like this.", "Montesinos looks at you as if waiting for you to speak to him. It would be discourteous to leave like this.", "Montesinos looks at you as if waiting for you to speak to him. It would be discourteous to leave like this.", "You don't walk out of the crystal palace. At most, you wait for them to pull on the rope.", "The cousin won't let you go without going down the cave: that's what he came for, and so did you.", "The ape scratches himself. His powers have run out.", "\"If your worship would like to SEE the show, sit down, it's just about to start.\"", "\"If your worship would like to SEE the show, sit down, it's just about to start.\"", "A puppet show with its little wax candles lit. The performance is about to begin. You only have to SEE it.", "A tailless ape, with a bottom like felt, but not a bad face. They say he divines.", "Without a sword in your hand you won't rout a Moorish army, even one made of paste.", "Whom? Master Pedro is a poor puppeteer. For the moment.", "Master Pedro sobs: \"Who is going to pay me for this?\"", "Master Pedro begs you to see the show before you go. It's free. For you.", "Are you going to leave now, with the Moors about to catch Gaiferos and Melisendra?", "Master Pedro clutches your arm: \"And who's going to pay for this?\"", "They are already tied.", "You will have to dismount first.", "You tie Rocinante and the dapple to the trunk of a willow. Sancho takes leave of his dapple like a man going off to war.", "You tie Rocinante and the dapple to the trunk of a willow. Sancho takes leave of his dapple like a man going off to war.", "You untie the boat. It stays still by the bank, waiting, as if it knew you were going to get in.", "You untie Rocinante and the dapple.", "You untie Rocinante and the dapple.", "The boat is in splinters. Luckily.", "The boat is tied to the tree. It won't go anywhere like that.", "And leave Rocinante and the dapple loose? Tie them to a tree first.", "You jump into the boat, and Sancho after you, weeping. The boat slowly moves away from the bank.", "To get into the boat, ENTER it.", "To get into the boat, ENTER it.", "A small boat without oars or tackle, tied to a tree. Enchanted, no doubt.", "The current carries you straight towards the watermills. The millers, covered in flour, come out with long poles, shouting. This calls for some knightly intervention.", "To you, a castle with a captive princess. To Sancho, some watermills. To the millers, a pair of lunatics about to drown.", "Without oars, the boat goes wherever the river wants.", "Get out? Into the water? Not in armour.", "That boat is calling you. You can't turn a deaf ear.", "Rocinante is still tied to the willow.", "A great lady is not approached like that, without ceremony. A knight first sends his squire with the message.", "A great lady is not approached like that, without ceremony. A knight first sends his squire with the message.", "You are not going to ride past a great lady without introducing yourself. It would be a discourtesy unworthy of a knight.", "The dukes won't let you leave so soon. Besides, things happen in this castle.", "\u00106\"Make yourself at home in our house, Señor Don Quixote.\"\u00107 The duchess covers her mouth with her fan.", "A grave ecclesiastic, one of those who, not being born princes, never manage to teach those who are how to be so.", "The dukes, who have read Part One of your history and are having a wonderful time.", "A countess in mourning, with a train in three points and a beard the barber of your village would envy.", "A wooden horse, with a peg in its forehead. They say that if you turn it, it flies. They say so.", "The Distressed Duenna stops you: \u00106\"Blindfolded, sir knight, for otherwise the height will make you giddy.\"\u00107", "The Distressed Duenna stops you: \u00106\"Blindfolded, sir knight, for otherwise the height will make you giddy.\"\u00107", "You are already mounted on Clavileño. Now, the peg.", "First you will have to mount Clavileño.", "First you will have to mount Clavileño.", "To fly you have to TURN the peg, not stroke it.", "The old man has the staff. You would have to ask him for it.", "You think, finger on your forehead. Why did he give him the staff to hold just as he swore? What could be inside it?", "One, with the look of a man who is owed money. The other, with a staff and in a hurry.", "You can't leave without passing sentence. You are the governor.", "You have eaten. At last, and only just.", "He hasn't done anything to you yet. Try to EAT, and you'll see.", "\u00106\"I am a physician, sir, and I am here so that your worship eats what is good for you.\"\u00107", "Doctor Pedro Recio de Agüero, native of Tirteafuera, with his whalebone wand. He looks as if he has never enjoyed a meal in his life, and doesn't want anyone else to.", "There is a lawsuit pending in the courtroom. A governor doesn't sleep with lawsuits pending.", "Nobody sleeps on an empty stomach. And Doctor Recio won't let you eat.", "Before sleeping, a good governor makes the rounds of the streets. They are to the west of the square.", "Sleep? After tonight? Out of the question.", "Resign? You've only just arrived. Though you're tempted.", "The dapple is in the stable, very well looked after. It isn't time to leave. Not yet.", "To leave the island properly, RESIGN the government. Or saddle the dapple.", "You are no knight errant. You leave that to your master.", "Rocinante is at the castle with your master. And the dapple is in the stable, eating a governor's barley.", "\u00104\"Who is down there?\"\u00107 \u00105\"Who should it be but the wretched Sancho Panza, governor, for his sins, of the island of Barataria, once squire to the famous knight Don Quixote of La Mancha?\"\u00107", "Go down there, just like that? To get Sancho out you need a rope.", "You go back to the castle shouting. The duke's servants come running with ropes and bring Sancho and the dapple up out of the pit. Sancho, on his knees, gives thanks to God.", "And leave the poor ungoverned governor down there?", "A deep, dark pit. If you throw a rope down, something might come up.", "The head says nothing. The student must have gone to lunch.", "\u00106\"Ask the enchanted head whatever you like, your worship, for it answers everything,\"\u00107 says Don Antonio.", "A head that seems to be of bronze, like those of the Roman emperors, on a stand of the same. It answers whatever it is asked, they say.", "First answer the challenge. A knight doesn't charge without accepting it.", "Mount Rocinante: this is a joust.", "No lance, no joust.", "The KNIGHT of the White Moon?", "Armed cap-a-pie, with a shining moon painted on his shield. His horse is bigger than Rocinante. A good deal bigger.", "The Knight of the White Moon is waiting for you. You are not going to run away in front of all Barcelona.", "Barcelona lies behind you, and your glory with it.", "Defeated, and with nothing to offer her, you don't dare enter El Toboso.", "She looks like a princess.", "She is a peasant girl.", "Both say they are Dulcinea del Toboso.", "\u00106\"I am Dulcinea del Toboso,\"\u00107 they both say at once. One smells of ambergris. The other, of raw garlic.", "Take the jewel out of the saddlebags first.", "You don't have the jewel.", "To which of the two? The PRINCESS or the PEASANT girl?", "The two girls stand in your way. You have to choose.", "A testament? You're ready for another sally, not for testaments.", "The notary dips his pen: \u00106\"Whenever your worship wishes, you may MAKE YOUR TESTAMENT.\"\u00107", "You can't stand on your feet.", "Mount Rocinante first. You are not going to leave him here, he has troubles enough of his own.", "Rocinante twitches an ear. That is all you will get out of him.", "You are carrying: ", "You are the narrator, not the knight. Narrators don't attack: at most, they criticise.", "The boy sells notebooks. It's the only thing he sells.", "They are written in Arabic and you don't know Arabic. You would need a Morisco who could read them.", "The Morisco opens one eye: \u00106\"Have you got something to read, or have you come to make conversation?\"\u00107", "Nobody in the Alcaná feels like chatting. Only like selling.", "Toledo is full of alleys and all you want is the rest of the story.", "You reread Belianis of Greece for the umpteenth time. The wounds he gave and received still seem too many to you.", "\"Sovereign and exalted lady...\" How e way. It should be strengthened inside with something.", "You make it again, putting some iron bars inside it, in such a way that you are satisfied with its strength.", "Your helmet already has a visor.", "What will you test it with? With a sword, if possible.", "You draw your sword and give it two strokes. With the first you undo in a moment what had taken you a week.", "You have no wish to put it to another trial: you consider it a very fine closed helmet.", "There is no visor to test.", "Like that, without a visor? Make it a visor first.", "You are Alonso Quijano, gentleman. What do you want more names for?", "You already have all the names you need: Rocinante, Don Quixote of La Mancha and Dulcinea del Toboso.", "\u00106\"Hands off, that cupboard is mine!\"\u00107 the housekeeper tells you.", "It is already open. The rat hasn't come back, luckily.", "There is a strange noise in the cupboard.", "Rather more beef than mutton. Hash most nights, scraps on Saturdays, lentils on Fridays. That is how three-quarters of your income goes.", "You eat a little hash. So much reading makes you hungry.", "It is already open.", "The chest is locked. And the key, like all the keys in the house, is kept by the housekeeper in her cupboard.", "You open the chest. Inside are your savings, in a purse, and a clean shirt.", "A pine chest, with its lock.", "You tear the sheet into several strips and make a ladder out of them. Your niece will not be pleased.", "Better pick it up first.", "You tear the sheet into several strips and make a ladder out of them. Your niece will not be pleased.", "You open the window. Between the bars of the grating there is room for a thin gentleman. You, for instance.", "A barred window looking onto the street. The bars are so far apart that the grating is more ornament than anything else.", "With the window shut, you won't hang much.", "You tie the ladder to the grating and let it drop out of the window. It just reaches the ground.", "You throw the lance out of the window. It lands in the street with a noise that would wake the dead, but not the housekeeper.", "You throw the buckler out of the window. It bounces twice.", "You throw the sword out of the window. Clink.", "You throw the purse out of the window. The ducats jingle.", "You throw the shirt out of the window. It glides a little.", "Better not throw that out of the window.", "With the window shut, you won't throw much.", "Down? Down where?", "In broad daylight? All the neighbours would see you and, what is worse, the housekeeper.", "With a lance on your back there is no way to climb down a sheet ladder. Not even Amadis could.", "You climb down the ladder with more dignity than agility.", "If you want to leave by the window, go DOWN the ladder.", "Sleep? Tonight, out of the question.", "You aren't sleepy. You have books.", "You aren't sleepy: you have plans. And you still need a squire.", "It is so early that not even the cocks are up. The door is locked and the housekeeper sleeps with the key.", "The housekeeper plants herself in the doorway: \u00106\"Where is your worship going? You are not leaving here until you are quite well.\"\u00107", "The door is locked. The key sleeps with the housekeeper.", "The front door is locked, and that key is not in the cupboard: the housekeeper carries it on her.", "It is nailed shut. Not even with the lance.", "The back door opens with a mere push. That is what back doors are for.", "The back door is thoroughly nailed shut.", "Go out into the fields? What for? You have books to read.", "Are you going out into the world without a name, on a horse without a name and with no lady to commend yourself to? Start to THINK.", "Your arms are covered in rust. A knight doesn't ride out like that.", "Put on the corselet. A knight doesn't ride out in his doublet.", "Your helmet is not ready. A knight doesn't ride out with his head half protected.", "Put on the helmet.", "A knight without a lance? It is on the rack in the hall.", "You are
