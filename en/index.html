hat he deserves.\"\u00107", "You pull on the reins, but Rocinante, who has his own opinions, takes the road to his stable.", "You pull on the reins, but Rocinante, who has his own opinions, takes the road to his stable.", "You pull on the reins, but Rocinante, who has his own opinions, takes the road to his stable.", "A knight errant doesn't choose his road on foot. Mount Rocinante.", "A knight errant doesn't choose his road on foot. Mount Rocinante.", "A knight errant doesn't choose his road on foot. Mount Rocinante.", "First you must give them the chance to confess. A knight doesn't attack without warning.", "The MERCHANTS?", "You don't intend to move from here until they confess what they have to confess.", "Mount Rocinante first. The books say so and so does Sancho.", "Sancho looks at you: \u00105\"And the lance, sir? Are you going to fight the giants with your fists?\"\u00107", "Sancho doesn't move: \u00105\"And the money? I'm not leaving the village without a penny.\"\u00107", "The house is locked. Just as well.", "The house is locked. Just as well.", "Climbing up a sheet ladder is even worse than climbing down.", "There is no turning back. At least not until the end of Part One.", "You have no lance.", "You grip the lance and couch it. That's more like it.", "You grip the lance and couch it. That's more like it.", "There are no giants left, only mills. And a certain grudge.", "One does not attack a giant on foot. Mount Rocinante.", "With what?", "You are carrying the lance like a broomstick. WIELD the lance first.", "Turn your back on thirty giants? Certainly not.", "Giants. Enormous. With arms almost two leagues long. Sancho insists they are mills. Sancho hasn't read anything.", "Mills. Now. Thanks to Freston.", "You wrench a dry branch from an oak that could almost serve you as a lance.", "You wrench a dry branch from an oak that could almost serve you as a lance.", "You wrench a dry branch from an oak that could almost serve you as a lance.", "To make a lance you need a good stick and an iron tip.", "Sancho stops you: \u00105\"Without a lance, sir? We won't get anywhere like this.\"\u00107", "You need the lance.", "\u00104\"Devilish and unnatural beings, release instantly the highborn princesses whom you are carrying off by force in this coach!\"\u00107 \u00106\"Sir knight, we are not devilish or unnatural, but two brothers of Saint Benedict.\"\u00107 They are lying, of course.", "The lady won't look out while those two enchanters are still there.", "First, the enchanters.", "The Biscayan hasn't done anything to you. Yet. Talk to the lady in the coach first.", "This is settled with swords, and you aren't carrying yours.", "The coach blocks your way. And there is a princess to set free.", "One more acorn and you'll start another speech. Better not.", "The YANGUESANS?", "Sancho, groaning at every step, slings you across the dapple and ties Rocinante behind. Rocinante limps with great dignity.", "Sancho, groaning at every step, slings you across the dapple and ties Rocinante behind. Rocinante limps with great dignity.", "And leave Rocinante at the mercy of those barbarians?", "You can't take a step. Literally. Sancho looks at his dapple, then at you, then at his dapple.", "Sancho has no intention of going back the way he came with you on his back.", "Rocinante is as battered as you are. Nobody could get on him.", "After last night, you have no intention of sleeping a wink in that bed.", "\u00106\"I'm an old Christian and an honest girl, even if I find myself in this inn.\"\u00107 Maritornes is a great deal of Maritornes.", "The balsam is already made.", "The recipe for Fierabras, according to your books, takes oil, wine, salt and rosemary. You are missing the oil.", "The recipe takes oil, wine, salt and rosemary. You are missing the wine.", "The recipe takes oil, wine, salt and rosemary. You are missing the salt.", "The recipe takes oil, wine, salt and rosemary. You are missing the rosemary.", "You have the ingredients, but where will you put the balsam? You need a container.", "You need a fire to cook on. Like the one in a kitchen.", "Unblessed, the balsam is no good. All the books say so. Well, none of them do, but you know it.", "You are already cured. Keep it for next time, for there will be one.", "You have nothing to pay with.", "You pay the innkeeper for the straw, the barley, the supper and the beds. You feel a little less of a knight, but Sancho is grateful from the bottom of his heart.", "In your state you wouldn't reach the corner. You need to be cured.", "Mount Rocinante first.", "Don't be a beast! You are not riding in on horseback.", "Don't be a beast! You are not riding in on horseback.", "It smells of stinking sheep. But to you it smells of glory.", "Mount Rocinante, this is a pitched battle.", "No lance, no lancing.", "The ARMY?", "The two clouds of dust block your way. There will have to be a fight.", "You need the lance.", "The MOURNERS?", "The lights advance towards you along the only road. There is no way past without facing them.", "Rocinante can only move in jumps. Sancho whistles, looking at the stars, which can't be seen.", "You wait. The noise doesn't stop. Neither does Sancho: he won't move a hand's breadth away from you.", "Something smells, and not of ambergris. Sancho, who hasn't left your side all night, looks the other way.", "With that din not even a dormouse could sleep.", "Mount Rocinante for the charge.", "You need the lance.", "The knight with the helmet? That is to say, the BARBER?", "The barber clings to his basin: \u00106\"What helmet? This is a basin, and it's mine. One step more and your worship will see what a barber can do with a razor.\"\u00107", "The barber clings to his basin: \u00106\"What helmet? This is a basin, and it's mine. One step more and your worship will see what a barber can do with a razor.\"\u00107", "Are you going to let the helmet of Mambrino get away?", "Take off the helmet first. One head, one helmet.", "Sancho holds back his laughter as best he can. It is too big for you, and half of it is missing. \u00104\"This famous helmet must have fallen into the hands of someone who melted it down for what it was worth and, with the other half, made this, which looks like a barber's basin.\"\u00107", "\u00106\"These are men forced by the king, going to the galleys. There is no more to be said.\"\u00107", "Before anything else, you will want to know why they are being taken like this. Ask the CONVICTS.", "You need the lance.", "The GUARDS?", "The guards won't let you just do that.", "That chain of wretches cries out for a knight errant.", "There is nothing useful left. Sancho has seen to that.", "You take one of the holland shirts from the valise.", "You take one of the holland shirts from the valise.", "The Ragged One of the Sorry Countenance tells you of his misfortunes in love. When, along the way, you defend the honour of Queen Madasima, he hurls a stone at your chest and vanishes among the crags.", "The Ragged One of the Sorry Countenance tells you of his misfortunes in love. When, along the way, you defend the honour of Queen Madasima, he hurls a stone at your chest and vanishes among the crags.", "You have done quite enough. Sancho still hasn't recovered.", "On what? There is no paper here. Not in the whole sierra.", "A LETTER? VERSES?", "The notebook is blank. Write the letter first.", "Sancho won't go: \u00105\"Wait, your worship, I have to see some madness so I can swear with a clear conscience that I saw you do it.\"\u00107", "The notebook is blank. Write the letter first.", "Sancho won't go: \u00105\"Wait, your worship, I have to see some madness so I can swear with a clear conscience that I saw you do it.\"\u00107", "Amadis prayed with a rosary. You haven't got one. A bit of cloth and a few knots would do.", "You pray a million ave-marias with your rosary of eleven knots. Or nearly.", "The princess is still on her knees. You can't go without answering her.", "If you leave, Sancho won't know where to find you.", "The enchanted don't leave their cages. All the books say so. If anything, they wait.", "The enchanted don't break cages. They wait.", "\u00104\"Be patient, Sancho, enchantments end when they end.\"\u00107", "You are in a cage, on a cart. The oxen decide for you.", "A good pair of Sancho's saddlebags. Inside there is: ", "A long lance, old and fearsome, in that order.", "An old leather buckler, to cover yourself from the blows you fail to dodge.", "Your great-grandfathers' sword. It cuts, if you insist.", "Some iron bars, thin and strong. They would do to strengthen something.", "The covers of a book by Feliciano de Silva. Good printer's pasteboard.", "A small key, the kind for a chest.", "Your savings: a few ducats you scraped together by selling one thing and pawning another.", "A clean shirt. The innkeeper said knights carried them.", "A linen sheet, long and strong. Your niece embroidered it.", "A ladder made of strips of sheet. It will hold. Probably.", "The iron tip of your lance. The only thing that survived the giant.", "A dry oak branch, long and almost straight. With a tip, it would be a lance.", "Notebooks written in Arabic characters. There is a drawing of a very thin knight and a very fat squire.", "Rosemary. It smells of hillside and of remedy.", "Salt. Salty.", "Olive oil. Good stuff, for an inn.", "Red wine. Or so the innkeeper says.", "A tin flask, the kind for keeping oil in.", "The balsam of Fierabras. A single drop, your books say, cures every wound. It smells awful.", "The helmet of Mambrino. It is of gold (or of brass), half the headpiece is missing and it has a notch for the beard. Sancho says it is a barber's basin. Sancho knows nothing about helmets.", "A richly bound memorandum book. Good for writing in.", "A strip of shirt with eleven knots, one bigger than the rest. Your rosary.", "You see nothing special.", "Where? The only thing you can put things into is the SADDLEBAGS.", "You have nothing to take it out of.", "The dapple is Sancho's. And Sancho is very particular about it.", "You are already mounted. As far as you know.", "Rocinante is not here.", "Rocinante is as battered as you are. Nobody could get on him.", "Mount a nameless nag? No knight errant would. First think of a name worthy of him.", "In your state, you couldn't even climb onto a chair.", "You mount Rocinante. He sighs; so do you, but with joy.", "You are not mounted.", "You dismount from Rocinante, who is grateful.", "You insult the air. The air, luckily, carries no sword.", "You talk to yourself, as usual. (To talk to someone: SAY TO SANCHO \"HELLO\")", "It smells of La Mancha: of thyme, of dust and of garlic.", "I don't think this is the right moment.", "This is no time to sleep. A knight errant sleeps little and badly.", "You have nothing to eat. Knights errant, according to your books, hardly eat.", "You have nothing to drink. Sancho has the wineskin, but he keeps an eye on it.", "There is nobody here worthy of your lance. For now.", "You have no lance to wield.", "You commend yourself to your lady Dulcinea. She, in El Toboso, has no idea.", "There is nothing to read here. More's the pity.", "You can't open that.", "There is no need to close anything.", "You cut two capers in the air. Nobody applauds.", "You hear the wind of La Mancha. And Sancho, chewing something.", "You search and don't find. Like nearly everybody.", "You are already up. More or less.", "Better not.", "Sancho doesn't want it. He wants islands.", "There is nobody to give it to.", "There is nobody here to pay. So much the better for you.", "Nothing is sold here.", "You don't know how to make that.", "There is no need to test that.", "Better not break that.", "There is nowhere to tie that.", "There is nothing to untie.", "You have nothing to write in, or on.", "You need a fire to cook on. Like the one in a kitchen.", "One, two, three... You lose count.", "Not here. There is a place for every madness.", "That is as clean as it is ever going to be.", "Arms are watched in a chapel. Or in a yard, if the chapel has been pulled down.", "You think. It hurts a little.", "There is nothing to cut.", "To whom?", "You are already awake. Or so you think.", "Who are you saying it to? (Talk like this: SAY TO SANCHO \"HELLO\")", "Who are you saying it to? (Talk like this: SAY TO SANCHO \"GOODBYE\")", "The bachelor Samson Carrasco is here, with Sancho, waiting for you to speak to him.", "The bachelor Samson Carrasco is still here, as sly as ever.", "Sancho looks at you out of the corner of his eye. He has something to ask you and doesn't know how.", "The notary waits with his pen wet. The housekeeper and the niece are weeping. So is Sancho.", "The three country girls have stopped on the road, on their young asses. Sancho, on his knees, is making signs to you.", "There is another knight here beside his mount: the Knight of the Mirrors.", "The lions' cart has stopped on the road. The lion keeper keeps his eyes on your lance.", "There is a lion here with a hungry look on his face.", "Basilio is bleeding to death on the ground, asking for Quiteria's hand. Camacho doesn't know what to do, and you have an opinion.", "Camacho's friends have their swords drawn. Basilio and Quiteria embrace behind the priest.", "Montesinos comes towards you, slowly, like someone who has been waiting for centuries.", "Dulcinea's companion is still there, with the petticoat in her hand, waiting for the reals.", "The puppet show is a wreck: beheaded Moors, Charlemagne without his crown. Master Pedro is weeping.", "What is left of the enchanted boat drifts away downstream.", "Rocinante and the dapple are tied to a willow.", "The great lady with the hawk looks at you both with curiosity. She seems to know who you are.", "The Distressed Duenna awaits your answer, with her beard and the beards of her twelve duennas.", "Clavileño the Swift waits in the middle of the garden, with his peg in his forehead.", "The two old men are waiting for your sentence. The one with the staff, in a hurry to leave.", "The table is full of dishes: fruit, partridges, a hash... Doctor Recio watches you closely, wand in hand.", "There are no rounds to make by day. The streets are quiet and the chronicler is bored.", "The girl dressed as a man is waiting, weeping, between two constables.", "Don Antonio's enchanted head stands on its jasper table.", "The Knight of the White Moon awaits your answer.", "The Knight of the White Moon has taken as much of the field as he needs and waits for you, lance in hand.", "The housekeeper and your niece are still asleep. It is very early.", "The housekeeper, who is past forty, stirs the pot. Your niece, who is not yet twenty, looks at you as one looks at an invalid.", "The house is asleep. The housekeeper snores with the door key under her pillow.", "Where the door of your library used to be there is now a smooth, freshly whitewashed wall.", "The front door is locked.", "The back door is nailed shut with four nails and a board. The housekeeper's doing.", "The innkeeper (whom you call the castellan) is here. So are the two girls, whom you call damsels.", "You are keeping vigil over your arms beside the trough.", "Juan Haldudo and his servant Andrés look at you as if you had better leave at once.", "It's the perfect occasion for them to confess Dulcinea's beauty.", "The sails turn quite calmly, as if nothing had happened.", "The Biscayan lady's coach has stopped on the road. A Biscayan squire keeps his eyes on you.", "The Yanguesans are still beating Rocinante.", "Juan Palomeque, the innkeeper, is around with the look of a man doing sums. Maritornes is scrubbing a pot.", "Sancho won't move a hand's breadth away from you.", "On the ground, half rotten, lie a cushion and a valise fastened to it.", "Across the crags leaps a half-naked man, with a thick black beard and long, tangled hair.", "The princess Micomicona waits on her knees for you to grant the boon she asks.", "Rocinante is here.", "Sancho Panza is here.", "\u00105You are worn out from so much walking. A knight errant rides on horseback, and for good reason.\u00107", "\u00102Your legs can hardly hold you up.\u00107", "Sancho looks at you, waiting. (Talk to him like this: SAY TO SANCHO \"HELLO\")", "\u00105\"Good day, sir.\"\u00107", "\u00105\"That's it, that's it: the island. When will it be?\"\u00107", "\u00105\"And what do I get out of all that, sir? For I have a wife and children.\"\u00107", "\u00105\"I'm following you already, sir, can't you see? Like a shadow. A hungry shadow.\"\u00107", "\u00105\"Oh no, I've no intention of leaving you alone!\"\u00107", "\u00105\"But doesn't your worship remember? I'm Sancho Panza.\"\u00107", "\u00105\"Not even my wife says that to me. Well, my wife does.\"\u00107", "\u00105\"And what do I get out of all that, sir?\"\u00107 asks Sancho, scratching his head.", "Sancho scratches his head: \u00105\"If your worship says so...\"\u00107", "The innkeeper nods very slyly, though he hasn't understood a thing. (Talk like this: SAY TO THE INNKEEPER \"HELLO\")", "\u00106\"If your worship, sir knight, is looking for lodging, bar the bed (for there is not one in this inn), everything else will be found here in great abundance.\"\u00107", "\u00106\"You are a dubbed knight now, and a good one. Now go with God, and don't come back here for a while.\"\u00107", "You kneel before him: \u00104\"Never will I rise from where I am, valiant knight, until your courtesy grants me a boon.\"\u00107", "\u00106\"First watch your arms in the yard, for so the order commands.\"\u00107", "\u00106\"You are a dubbed knight now, and a good one. Now go with God.\"\u00107", "You kneel before him: \u00104\"Never will I rise from where I am, valiant knight, until your courtesy grants me a boon.\"\u00107", "\u00106\"First watch your arms in the yard, for so the order commands.\"\u00107", "\u00106\"Castellan your worship calls me, and castellan I'll stay.\"\u00107", "\u00106\"Money, clean shirts and ointments. And a squire. That's what a proper knight carries.\"\u00107", "The innkeeper nods very slyly: \u00106\"Whatever your worship commands.\"\u00107", "The farmer ignores you. (Talk like this: SAY TO THE FARMER \"HELLO\")", "\u00106\"He is my servant and I'll beat him when I see fit.\"\u00107", "\u00106\"Juan Haldudo the rich, of Quintanar. And this is Andrés, my servant, who loses me a sheep every day.\"\u00107", "\u00106\"I owe him nine months, at seven reals a month. But I've taken off three pairs of shoes and two bleedings.\"\u00107 \u00104\"The shoes are paid for by the lashes you have given him for no fault of his.\"\u00107", "\u00106\"I owe him nine months, at seven reals a month. But I've taken off three pairs of shoes and two bleedings.\"\u00107 \u00104\"The shoes are paid for by the lashes you have given him for no fault of his.\"\u00107", "\u00106\"Don't poke your nose in where you're not wanted, your worship.\"\u00107", "\u00106\"Yes, yes, I'll pay him. Off you go, your worship, and don't worry.\"\u00107", "The merchants wait. (Try: SAY TO THE MERCHANTS \"CONFESS THAT DULCINEA IS THE FAIREST\")", "\u00106\"We've already told you to show us the portrait.\"\u00107", "The goatherds look at you politely. (Talk like this: SAY TO THE GOATHERDS \"HELLO\")", "\u00106\"Here, your worship, we've salt to spare.\"\u00107 A goatherd gives you a handful of salt.", "\u00106\"We gave you some already, sir. Do you eat that much?\"\u00107", "\u00106\"Take as much as you like, your worship, there's plenty about.\"\u00107", "\u00106\"Tomorrow they bury Grisostomo, the student who died of love for the shepherdess Marcela. Your worship can come, if you like.\"\u00107 Of anything else the goatherds know nothing.", "Juan Palomeque shrugs. (Talk like this: SAY TO THE INNKEEPER \"HELLO\")", "\u00106\"Welcome, sir knight. We'll talk about the bill later.\"\u00107", "\u00106\"There's oil and wine for your worship. I've no salt or rosemary left, the carriers take it all.\"\u00107", "\u00106\"There's oil and wine for your worship. I've no salt or rosemary left, the carriers take it all.\"\u00107", "\u00106\"Balsam? I can give you oil and wine. I've no salt or rosemary left, the carriers take it all.\"\u00107", "\u00106\"There's oil and wine for your worship. I've no salt or rosemary left, the carriers take it all.\"\u00107", "\u00106\"I've none left. Ask the goatherds, they have everything.\"\u00107", "\u00106\"Rosemary doesn't grow here, sir. Where the goatherds are, it does.\"\u00107", "\u00106\"There's a flask over there, by the fire. Use it, but don't lose it on me.\"\u00107", "\u00106\"That's it, that's it. Pay me, your worship, and we'll have peace here and glory hereafter.\"\u00107", "\u00106\"If your worship says so...\"\u00107 says Juan Palomeque, doing sums in his head.", "The princess waits for your answer. (Talk like this: SAY TO THE PRINCESS \"YES\")", "\u00106\"What do you mean, no? Are you not the famous Don Quixote, who defends damsels in distress?\"\u00107 Well, yes. You are.", "\u00106\"I only ask you to grant me the boon I ask.\"\u00107", "\u00105Cide Hamete Benengeli whispers to you:\u00107 ", "\"The books in your library don't read themselves.\"", "\"A knight, his horse and his lady need names. Start to THINK.\"", "\"Your great-grandfathers' arms, up in the attic, are covered in rust.\"", "\"A helmet without a visor is half a morion. Book covers are good pasteboard.\"", "\"An untested helmet is an untested helmet. Have you got a sword?\"", "\"Make it again, strengthened inside. There are iron bars in the attic.\"", "\"Ride out into the fields through the back door of the yard: armed, with lance and buckler, and on Rocinante's back.\"", "\"Ask the castellan of this castle to dub you a knight.\"", "\"Watch your arms in the yard. And defend them from anyone who touches them.\"", "\"Someone is crying out in the wood. A knight does not pass by.\"", "\"Let Rocinante choose the road. And defend Dulcinea's beauty before anyone.\"", "\"Ask in the kitchen about your library.\"", "\"Your neighbour Sancho needs a good reason to follow you. An island, for example.\"", "\"Your savings are in the chest in your bedchamber. The key, in the housekeeper's cupboard. And there is something in the cupboard that bites: protect yourself.\"", "\"Wait for night: SLEEP in your bedchamber.\"", "\"The door is locked; the window isn't. A torn sheet makes a ladder.\"", "\"Sancho is waiting in the street. Mind: you can't climb down a ladder with a lance in your hand, but you can throw it out of the window.\"", "\"Giants are attacked on horseback, with the lance firmly wielded.\"", "\"A dry oak branch and the tip of the broken lance make a new lance.\"", "\"Those two friars are enchanters carrying off a princess. It's perfectly clear.\"", "\"Talk to the lady in the coach.\"", "\"Find someone who will sell you the rest of the manuscript. And then, someone who will translate it.\"", "\"The Biscayan fights with the sword.\"", "\"The goatherds offer you something to eat. Don't be rude.\"", "\"The goatherds cure with rosemary and salt. Ask them for salt and pick some rosemary: you'll need them.\"", "\"Are you going to let them beat Rocinante?\"", "\"You can't even move. Get on Sancho's dapple.\"", "\"You need rest. There is a bed in the garret. So to speak.\"", "\"The balsam of Fierabras takes oil, wine, salt and rosemary, and is cooked in the kitchen. Ask the innkeeper for what you lack and look for a flask.\"", "\"A balsam without prayers is no good at all.\"", "\"Drink the balsam. You'll see how good it is for you. Not at first.\"", "\"Two armies face each other on the plain. Though they smell funny.\"", "\"Those lights won't let you pass unless you attack them.\"", "\"At night, with Rocinante tied up, there is little you can do. WAIT for dawn, or ask Sancho to tell you a story.\"", "\"That golden helmet must be yours. At the gallop, with the lance.\"", "\"Ask the convicts why they are prisoners.\"", "\"A knight errant does not allow people to be led like that. The GUARDS are one too many.\"", "\"There is an abandoned valise in the sierra.\"", "\"On the Peña Pobre, Amadis did penance. You can do the same. And undress, while you're at it.\"", "\"Write a letter to Dulcinea. In the notebook from the valise.\"", "\"Give the notebook to Sancho so he can take the letter to El Toboso.\"", "\"Make a rosary from a strip of shirt, and pray.\"", "\"Write verses on the trees, as every self-respecting lover does.\"", "\"The princess asks you for a boon. Grant it.\"", "\"Sleep in the garret. And may your dreams guide you.\"", "\"The giant! Attack him!\"", "\"Go back to sleep. What will come, will come.\"", "\"Await your fate with patience. The enchanted wait.\"", "\u00105Visible exits:\u00107 ", "north ", "south ", "east ", "west ", "northeast ", "southwest ", "up ", "down ", "in ", "out ", "none that you can see", "The housekeeper and your niece look at you with pity. (Talk like this: SAY TO THE NIECE \"HELLO\")", "\u00106\"Oh, uncle! No books and no libraries, that's all the work of enchanters.\"\u00107", "\u00106\"Oh, uncle, leave those books alone, they'll dry up your brains!\"\u00107", "\u00105Cide Hamete Benengeli whispers to you:\u00107 ", "\"The old man gave him the staff to hold just before swearing. Ask him for it, and see what is inside.\"", "\"If the doctor won't let you eat, get him out of the way. With words, or with threats.\"", "\"Now then: EAT.\"", "\"A governor makes the rounds of the streets at night, west of the square. And talks to whoever he meets.\"", "\"Go and SLEEP in your bedchamber. What will come, will come.\"", "\"You have seen what governing is. RESIGN and go back to your old freedom.\"", "\"Talk to the bachelor Samson Carrasco, in the hall. He knows things about your history that not even you know.\"", "\"Talk to Sancho. He wants to ask you something.\"", "\"Sancho wants a wage. No knight errant's squire was ever paid one: tell him NO.\"", "\"Your arms are in your bedchamber and in the hall. Arm yourself, mount Rocinante and ride out through the yard. And, for a rainy day, look under the mattress.\"", "\"Dulcinea doesn't live in a church. Ask someone in the town; an early-rising farmer passes along the lane.\"", "\"Sancho has an idea, even if it isn't a good one. Ask him.\"", "\"Sancho asked you to wait for him in the oak grove, south of the town. WAIT.\"", "\"Before his lady, a knight goes down on his knees. KNEEL.\"", "\"That strange cart deserves a question. Talk to DEATH, he doesn't bite.\"", "\"Greet the knight: SAY TO THE KNIGHT \"HELLO\".\"", "\"Casildea fairer than Dulcinea? Tell him NO. And get ready.\"", "\"ATTACK the knight, quickly, he won't wait!\"", "\"Ask the lion KEEPER what he has in the cart.\"", "\"Ask him to OPEN THE CAGE. Better on foot: Rocinante is in no state for lions.\"", "\"Don't attack him: music soothes the savage beast. SING.\"", "\"The lion has left a jewel on the ground. A jewel worthy of Dulcinea...\"", "\"The wedding is north of the meadow. And in the meadow you can eat very well.\"", "\"Basilio asks for Quiteria's hand before he dies. Persuade CAMACHO to allow it.\"", "\"Camacho's men are going for Basilio. Get between them and say something, or do something.\"", "\"The mouth of the cave is blinded by brambles. CUT them with the sword.\"", "\"Tie Basilio's rope round your waist. On foot, of course.\"", "\"Go down, and in the cave look for a hollow where you can lie down to sleep. These caves are best explored dreaming.\"", "\"Talk to MONTESINOS.\"", "\"Dulcinea needs money. Didn't you bring a few reals from home?\"", "\"When you tire of the palace, WAIT for them to pull on the rope.\"", "\"Master Pedro is putting on a show. SEE THE SHOW.\"", "\"The Moors are going to catch Gaiferos and Melisendra! Sword in hand, a knight doesn't allow it.\"", "\"What is broken must be paid for. PAY.\"", "\"Dismount and TIE ROCINANTE to a tree before you embark.\"", "\"UNTIE THE BOAT and ENTER it.\"", "\"That castle on the river surely holds a captive princess. ATTACK.\"", "\"To a great lady one sends a message through one's squire. Talk to SANCHO.\"", "\"The ecclesiastic in the hall has insulted you. Answer him as a knight.\"", "\"Take a stroll in the garden.\"", "\"The Distressed Duenna asks for your help. Tell her YES.\"", "\"To ride Clavileño you must be blindfolded. There was a handkerchief on the table in the hall.\"", "\"MOUNT CLAVILENO.\"", "\"TURN THE PEG.\"", "\"Sancho is in the pit. THROW THE ROPE. And if you have none, ask for help at the castle, to the north.\"", "\"Ask Don Antonio's enchanted HEAD something.\"", "\"Go down to the beach, to the south. Someone is waiting for you.\"", "\"Accept the challenge. A knight doesn't back down.\"", "\"On horseback and with the lance: ATTACK THE KNIGHT. Whatever happens.\"", "\"Dulcinea is the one who is bewitched. Remember whom you saw at El Toboso. GIVE THE JEWEL TO THE...\"", "\"There are two roads: to the west, your village. To the north, El Toboso, if you carry something worthy of Dulcinea.\"", "\"Sleep. When you wake, you will see things differently.\"", "\"Make your testament. Every story has its end.\"", "\u00105\"Talk to the bachelor, your worship, he knows more than I do about your history.\"\u00107", "You open your mouth to say yes, but what comes out is what your books say: \u00104\"A wage? No squire of a knight errant was ever paid a wage.\"\u00107 Better to tell him NO and put up with the tears.", "\u00105\"Will you give me a wage or won't you? Say yes or no, for Teresa is waiting for me.\"\u00107", "\u00105\"Good day, sir.\"\u00107", "\u00105\"Not even my wife says that to me. Well, my wife does.\"\u00107", "\u00105\"Ask someone in the town, your worship, for I don't know where your princess lives.\"\u00107", "\u00105\"Ask someone in the town, your worship, for I don't know where your princess lives.\"\u00107", "\u00105\"Ask that farmer, your worship, he gets up earlier than we do.\"\u00107"
